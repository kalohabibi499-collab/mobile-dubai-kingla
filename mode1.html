  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/GLTFLoader.js";
    import { VRMUtils, VRMLoaderPlugin } from "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js";

    const canvas = document.getElementById("camVrmCanvas");
    const video = document.getElementById("camera");
    if (typeof window.__autoModeNoFaceDetect === "undefined") {
      window.__autoModeNoFaceDetect = false;
    }
    if (typeof window.__autoModeIdleAmount === "undefined") {
      window.__autoModeIdleAmount = 1;
    }
    if (typeof window.__autoModeIdleSpeed === "undefined") {
      window.__autoModeIdleSpeed = 1;
    }
    if (!canvas || !video) {
      window.VRMController = { enable: () => {}, resize: () => {}, load: () => {}, loadFile: () => {}, setPoseStrong: () => {}, setPoseAngle: () => {}, setExternalTalking: () => {} };
    } else {
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
      const maxPixelRatio = 1.25;
      renderer.setPixelRatio(Math.min(maxPixelRatio, window.devicePixelRatio || 1));
      renderer.setClearColor(0x000000, 0);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
      camera.position.set(0, 1.4, 2.2);

      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(1, 2, 3);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));

      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));
      let currentVrm = null;
      let currentModel = null;
      let enabled = false;
      let vrmReady = false;
      let poseStrongOverride = null;
      let poseAngleOverride = null;

      function resize() {
        const w = canvas.clientWidth || 1;
        const h = canvas.clientHeight || 1;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }

      function setBoneRotation(vrm, boneName, x, y, z) {
        const bone = vrm.humanoid?.getNormalizedBoneNode(boneName);
        if (!bone) return;
        bone.rotation.x = x;
        bone.rotation.y = y;
        bone.rotation.z = z;
      }

      function applyIdlePoseFromUpperZ(vrm, upperZ) {
        const baseUpper = 1.3;
        const strongUpper = 2.2;
        const t = Math.max(0, Math.min(1, (upperZ - baseUpper) / (strongUpper - baseUpper)));
        const lowerX = 0.35 + (0.9 - 0.35) * t;
        const lowerZ = 0.05 + (0.15 - 0.05) * t;
        const handZ = 0.05 + (0.1 - 0.05) * t;
        setBoneRotation(vrm, "leftUpperArm", 0, 0, upperZ);
        setBoneRotation(vrm, "rightUpperArm", 0, 0, -upperZ);
        setBoneRotation(vrm, "leftLowerArm", lowerX, 0, lowerZ);
        setBoneRotation(vrm, "rightLowerArm", lowerX, 0, -lowerZ);
        setBoneRotation(vrm, "leftHand", 0, 0, handZ);
        setBoneRotation(vrm, "rightHand", 0, 0, -handZ);
      }

      function applyIdlePose(vrm, strong = false) {
        // Arms slightly down and relaxed (stronger for some VRoid exports)
        const upperZ = typeof poseAngleOverride === "number" ? poseAngleOverride : (strong ? 2.2 : 1.3);
        applyIdlePoseFromUpperZ(vrm, upperZ);
      }

      function resolvePoseStrong(vrm) {
        if (typeof poseStrongOverride === "boolean") return poseStrongOverride;
        const vrmName = (vrm?.meta?.name || vrm?.meta?.title || "") + "";
        return /AvatarSample|AvatarSample_V|AvatarSample_R|VRoid/i.test(vrmName);
      }

      function applyPoseToCurrent(strong) {
        if (currentVrm) applyIdlePose(currentVrm, strong);
      }

      // Monotonic token: only the most recently *requested* load is applied, so
      // a slow default load can't clobber a user avatar requested right after
      // it (or vice-versa) just because it finished last.
      let loadSeq = 0;
      function loadVrm(url, revokeUrl = false) {
        const seq = ++loadSeq;
        loader.load(
          url,
          (gltf) => {
            if (seq !== loadSeq) { // superseded by a newer request — discard
              if (revokeUrl) { try { URL.revokeObjectURL(url); } catch (e) {} }
              return;
            }
            const vrm = gltf.userData.vrm;
            if (currentVrm) scene.remove(currentVrm.scene);
            if (currentModel) scene.remove(currentModel);
            currentVrm = null;
            currentModel = null;

            if (vrm) {
              VRMUtils.removeUnnecessaryVertices(gltf.scene);
              VRMUtils.removeUnnecessaryJoints(gltf.scene);
              currentVrm = vrm;
              VRMUtils.rotateVRM0(vrm);
              applyIdlePose(vrm, resolvePoseStrong(vrm));
              const box = new THREE.Box3().setFromObject(vrm.scene);
              const height = Math.max(0.001, box.max.y - box.min.y);
              const scale = (1.6 * 1.5) / height;
              vrm.scene.scale.setScalar(scale);
              const downOffset = 0.8;
              vrm.scene.position.y = -box.min.y * scale - downOffset;
              currentModel = vrm.scene;
              scene.add(vrm.scene);
            } else {
              // Fallback: render generic GLB (no VRM metadata)
              const box = new THREE.Box3().setFromObject(gltf.scene);
              const height = Math.max(0.001, box.max.y - box.min.y);
              const scale = (1.6 * 1.5) / height;
              gltf.scene.scale.setScalar(scale);
              const downOffset = 0.8;
              gltf.scene.position.y = -box.min.y * scale - downOffset;
              currentModel = gltf.scene;
              scene.add(gltf.scene);
              console.warn("Loaded GLB without VRM metadata. Facial tracking is disabled.");
            }

            vrmReady = true;
            if (enabled && video) video.style.opacity = "0";
            if (revokeUrl) URL.revokeObjectURL(url);
            try { window.dispatchEvent(new Event("vrm-ready-change")); } catch (e) { /* ignore */ }
          },
          undefined,
          (err) => {
            if (revokeUrl) { try { URL.revokeObjectURL(url); } catch (e) {} }
            if (seq !== loadSeq) return; // superseded — ignore its failure
            console.error("Failed to load VRM:", err);
            vrmReady = false;
            try { window.dispatchEvent(new Event("vrm-ready-change")); } catch (e) { /* ignore */ }
          }
        );
      }

      // Load the provided VRM
      loadVrm("vrm/vrm2.vrm");

      // Face tracking (head rotation)
      let headYaw = 0;
      let headPitch = 0;
      let headRoll = 0;
      let mouthOpen = 0;
      let blinkLeft = 0;
      let blinkRight = 0;
      let smile = 0;
      let externalTalking = false;
      let externalTalkPhase = 0;
      let autoBlinkNextAt = performance.now() + 1400;
      let autoBlinkStartedAt = 0;
      const autoBlinkDurationMs = 190;
      let autoIdlePhase = 0;
      let autoIdleLookYaw = 0;
      let autoIdleLookPitch = 0;
      let autoIdleLookNextAt = performance.now() + 1100;
      let faceMesh = null;

      function clamp01(val) {
        return Math.max(0, Math.min(1, val));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function dist(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      function updateHeadFromLandmarks(landmarks) {
        if (window.__autoModeNoFaceDetect) return;
        if (!landmarks || !landmarks.length) return;
        const leftEye = landmarks[33];
        const rightEye = landmarks[263];
        const nose = landmarks[1];
        const eyeMidX = (leftEye.x + rightEye.x) * 0.5;
        const eyeMidY = (leftEye.y + rightEye.y) * 0.5;
        headYaw = (nose.x - eyeMidX) * -3.0;
        headPitch = (nose.y - eyeMidY) * 2.5;
        headRoll = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x) * -1.0;

        // Mouth open (inner lips)
        const mouthTop = landmarks[13];
        const mouthBottom = landmarks[14];
        const mouthLeft = landmarks[61];
        const mouthRight = landmarks[291];
        const mouthOpenRaw = dist(mouthTop, mouthBottom) / Math.max(0.001, dist(mouthLeft, mouthRight));
        const mouthOpenTarget = clamp01((mouthOpenRaw - 0.02) * 8.0);

        // Smile (mouth width vs height)
        const smileRaw = dist(mouthLeft, mouthRight) / Math.max(0.001, dist(mouthTop, mouthBottom));
        const smileTarget = clamp01((smileRaw - 2.0) * 0.5);

        // Eye blink
        const leftEyeTop = landmarks[159];
        const leftEyeBottom = landmarks[145];
        const leftEyeOuter = landmarks[33];
        const leftEyeInner = landmarks[133];
        const rightEyeTop = landmarks[386];
        const rightEyeBottom = landmarks[374];
        const rightEyeOuter = landmarks[362];
        const rightEyeInner = landmarks[263];

        const leftEyeOpen = dist(leftEyeTop, leftEyeBottom) / Math.max(0.001, dist(leftEyeOuter, leftEyeInner));
        const rightEyeOpen = dist(rightEyeTop, rightEyeBottom) / Math.max(0.001, dist(rightEyeOuter, rightEyeInner));
        const leftBlinkTarget = clamp01(1.0 - (leftEyeOpen - 0.15) * 6.0);
        const rightBlinkTarget = clamp01(1.0 - (rightEyeOpen - 0.15) * 6.0);

        // Smooth values
        mouthOpen = lerp(mouthOpen, mouthOpenTarget, 0.35);
        smile = lerp(smile, smileTarget, 0.25);
        blinkLeft = lerp(blinkLeft, leftBlinkTarget, 0.5);
        blinkRight = lerp(blinkRight, rightBlinkTarget, 0.5);
      }

      function initFaceMesh() {
        if (faceMesh || typeof FaceMesh === "undefined") return;
        faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`,
        });
        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: false,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5,
        });
        faceMesh.onResults((results) => {
          if (results.multiFaceLandmarks && results.multiFaceLandmarks[0]) {
            updateHeadFromLandmarks(results.multiFaceLandmarks[0]);
          }
        });
      }

      async function faceLoop() {
        if (!enabled || !faceMesh) return;
        if (!window.__autoModeNoFaceDetect && video.readyState >= 2) {
          try { await faceMesh.send({ image: video }); } catch (e) { /* ignore */ }
        }
        requestAnimationFrame(faceLoop);
      }

      function getAutoBlinkValue(nowMs) {
        if (nowMs >= autoBlinkNextAt) {
          autoBlinkStartedAt = nowMs;
          autoBlinkNextAt = nowMs + 2000 + Math.random() * 2600;
        }
        if (!autoBlinkStartedAt) return 0;
        const elapsed = nowMs - autoBlinkStartedAt;
        if (elapsed >= autoBlinkDurationMs) {
          autoBlinkStartedAt = 0;
          return 0;
        }
        const p = Math.max(0, Math.min(1, elapsed / autoBlinkDurationMs));
        return p < 0.5 ? (p * 2) : ((1 - p) * 2);
      }

      function getAutoIdleHead(nowMs) {
        const idleAmount = Math.min(2.5, Math.max(0.3, Number(window.__autoModeIdleAmount) || 1));
        const idleSpeed = Math.min(2.5, Math.max(0.5, Number(window.__autoModeIdleSpeed) || 1));
        if (nowMs >= autoIdleLookNextAt) {
          // Small random glances to avoid a frozen stare.
          autoIdleLookYaw = (Math.random() * 2 - 1) * 0.08 * idleAmount;
          autoIdleLookPitch = (Math.random() * 2 - 1) * 0.04 * idleAmount;
          autoIdleLookNextAt = nowMs + (1200 + Math.random() * 2000) / idleSpeed;
        }
        autoIdlePhase += 0.03 * idleSpeed;
        const waveYaw = (Math.sin(autoIdlePhase * 0.95) * 0.03 + Math.sin(autoIdlePhase * 0.31) * 0.015) * idleAmount;
        const wavePitch = Math.sin(autoIdlePhase * 0.8) * 0.014 * idleAmount;
        const waveRoll = Math.sin(autoIdlePhase * 0.6) * 0.018 * idleAmount;
        return {
          yaw: autoIdleLookYaw + waveYaw,
          pitch: autoIdleLookPitch + wavePitch,
          roll: waveRoll,
        };
      }

      let lastRenderTime = 0;
      const targetFrameMs = 33;
      function render() {
        requestAnimationFrame(render);
        const now = performance.now();
        if (now - lastRenderTime < targetFrameMs) return;
        lastRenderTime = now;
        if (!enabled || !currentModel) return;
        if (window.__autoModeNoFaceDetect) {
          const idleHead = getAutoIdleHead(now);
          headYaw = lerp(headYaw, idleHead.yaw, 0.16);
          headPitch = lerp(headPitch, idleHead.pitch, 0.14);
          headRoll = lerp(headRoll, idleHead.roll, 0.14);
          mouthOpen = lerp(mouthOpen, 0, 0.2);
          smile = lerp(smile, 0.08, 0.1);
          const autoBlink = getAutoBlinkValue(now);
          blinkLeft = lerp(blinkLeft, autoBlink, 0.65);
          blinkRight = lerp(blinkRight, autoBlink, 0.65);
        }
        if (currentVrm) {
          const head = currentVrm.humanoid?.getNormalizedBoneNode("head");
          if (head) {
            head.rotation.y = headYaw;
            head.rotation.x = headPitch;
            head.rotation.z = headRoll;
          }
          const expr = currentVrm.expressionManager || currentVrm.blendShapeProxy;
          if (expr) {
            if (externalTalking) {
              externalTalkPhase += 0.32;
            }
            const externalMouth = externalTalking ? (0.3 + (Math.sin(externalTalkPhase) * 0.25 + 0.25)) : 0;
            const mouthVal = Math.max(mouthOpen, externalMouth);
            expr.setValue("aa", mouthVal);
            if (typeof expr.setValue === "function") {
              try { expr.setValue("a", mouthVal); } catch(e) {}
            }
            expr.setValue("blinkLeft", blinkLeft);
            expr.setValue("blinkRight", blinkRight);
            expr.setValue("happy", smile);
          }
          currentVrm.update(1 / 60);
        }
        renderer.render(scene, camera);
      }

      render();

      window.VRMController = {
        enable(next) {
          enabled = !!next;
          canvas.style.display = enabled ? "block" : "none";
          if (video) video.style.opacity = enabled && vrmReady ? "0" : "1";
          if (enabled) {
            initFaceMesh();
            resize();
            faceLoop();
          }
        },
        load(url) {
          if (!url) return;
          loadVrm(url, false);
        },
        loadFile(file) {
          if (!file) return;
          const url = URL.createObjectURL(file);
          loadVrm(url, true);
        },
        setPoseStrong(next) {
          poseAngleOverride = null;
          poseStrongOverride = typeof next === "boolean" ? next : null;
          applyPoseToCurrent(resolvePoseStrong(currentVrm));
        },
        setPoseAngle(next) {
          const asNumber = Number(next);
          if (!Number.isFinite(asNumber)) {
            poseAngleOverride = null;
          } else {
            poseAngleOverride = (asNumber * Math.PI) / 180;
          }
          applyPoseToCurrent(resolvePoseStrong(currentVrm));
        },
        setExternalTalking(next) {
          externalTalking = !!next;
          if (!externalTalking) externalTalkPhase = 0;
        },
        // Whether an avatar has actually loaded. The main script already gates
        // on camVrmEnabled, so this just reports "is there something to render"
        // — lets it avoid hiding the live camera behind a blank VRM canvas.
        isReady() { return vrmReady; },
        resize,
      };

      // Default VRM disabled (real camera is preferred until user enables avatar)
      window.VRMController.enable(false);

      window.addEventListener("resize", resize);
      resize();
    }
  </script>

  <!-- Modularized front-end pieces (loaded before the main script). -->
  <script src="js/app-namespace.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/decor.js"></script>
  <!-- Browser-side TikTok profile fallback (residential-IP resolution when

        const tx = db.transaction(ASSET_CACHE_STORE, 'readonly');
        const r = tx.objectStore(ASSET_CACHE_STORE).get(key);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => reject(r.error);
      });
    }
    function saveAssetBlob(db, key, blob) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(ASSET_CACHE_STORE, 'readwrite');
        tx.objectStore(ASSET_CACHE_STORE).put(blob, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    function resolveAssetUrl(url) {
      return assetBlobUrls.get(url) || url;

    async function downloadAndCacheAsset(db, url) {
      try {
        const cached = await getAssetBlob(db, url);
        if (cached) {
          assetBlobUrls.set(url, URL.createObjectURL(cached));
          return;
        }
        const isProtected = url.startsWith('/api/protected-media/');
        const resp = await fetch(url, isProtected ? { credentials: 'include' } : {});
        if (!resp.ok) throw new Error(resp.status);
        const blob = await resp.blob();
        await saveAssetBlob(db, url, blob);
        assetBlobUrls.set(url, URL.createObjectURL(blob));
      } catch (err) {
        console.warn('Asset cache miss:', url, err);
      }
    }

      const now = Date.now();
      if (now - autoGiftLastAt < autoGiftConfig.intervalMs) return;

      const occupied = [];
      for (let i = 0; i < seatCount; i++) {
        if (seats[i]) occupied.push(i);

      const eligibleOccupied = occupied.filter((idx) => !hasVisibleSeatGiftIcon(idx));

      // Run auto gift on all active seats (skip seats still showing icon).
      const batch = [];

        const randomGiftId = autoGiftConfig.selected[Math.floor(Math.random() * autoGiftConfig.selected.length)];
        const iconGift = autoGiftIconLibrary[randomGiftId];

        const safeCurrent = Number.isFinite(current) ? current : 0;
        const delta = Number(iconGift.points) || 0;
        seats[seatIdx].points = safeCurrent + delta;
        batch.push({ seatIdx, delta, icon: iconGift.icon, giftId: iconGift.giftId || "" });
      });

    function computeSeatColor(idx, avatarUrl) {
      if (!avatarUrl) return;
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        try {
          const canvas = document.createElement("canvas");
          const size = 24;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");
          if (!ctx) return;
          ctx.drawImage(img, 0, 0, size, size);
          const data = ctx.getImageData(0, 0, size, size).data;
          let r = 0, g = 0, b = 0;
          const pixels = size * size;
          for (let i = 0; i < data.length; i += 4) {
            r += data[i];
            g += data[i + 1];
            b += data[i + 2];
          }
          r = Math.round(r / pixels);
          g = Math.round(g / pixels);
          b = Math.round(b / pixels);
          seatColors[idx] = `rgb(${r}, ${g}, ${b})`;
          applyRoomStyle();
        } catch (err) {
          seatColors[idx] = null;
        }
      };
      img.onerror = () => { seatColors[idx] = null; };
      img.src = avatarUrl;

      if (!liveFirework) return;

      const timing = liveFireworkTiming;
      const originX = Math.round((Math.random() - 0.5) * 180);

      liveFirework.classList.remove("show", "center-hidden");
      liveFirework.innerHTML = "";
      liveFirework.style.setProperty("--origin-x", `${originX}px`);
      liveFirework.style.setProperty("--origin-y", `${originY}px`);

      const core = document.createElement("div");
      core.className = "live-firework-core";
      const avatar = document.createElement("img");
      avatar.className = "live-firework-avatar";
      avatar.src = avatarSrc;
      avatar.alt = "Donor";
      const gift = document.createElement("img");
      gift.className = "live-firework-gift";

      gift.alt = "Gift";
      core.append(avatar, gift);
      core.style.animationDuration = `${timing.flightMs}ms`;
      liveFirework.appendChild(core);

      const burstOffsets = [
        [110, 0], [-110, 0], [0, 110], [0, -110],
        [78, 78], [78, -78], [-78, 78], [-78, -78],
      ];

      const waves = [
        { delay: timing.firstBurstDelayMs, mult: 0.72 },
        { delay: timing.firstBurstDelayMs + timing.waveGapMs, mult: 0.92 },
        { delay: timing.firstBurstDelayMs + timing.waveGapMs * 2, mult: 1.12 },
      ];
      waves.forEach((wave, waveIdx) => {
        const particleSrc = waveIdx % 2 === 0 ? giftSrc : avatarSrc;
        const angleJitter = (Math.random() * 360) * (Math.PI / 180);
        const cosA = Math.cos(angleJitter);
        const sinA = Math.sin(angleJitter);
        burstOffsets.forEach(([x, y], idx) => {
          const b = document.createElement("img");
          b.className = "live-firework-burst";
          b.src = particleSrc;
          b.alt = "";
          const rx = x * cosA - y * sinA;
          const ry = x * sinA + y * cosA;
          b.style.setProperty("--fx", `${Math.round(rx * wave.mult)}px`);
          b.style.setProperty("--fy", `${Math.round(ry * wave.mult)}px`);
          b.style.setProperty("--delay", `${wave.delay + (idx % 2) * 20}ms`);
          b.style.animationDuration = `${timing.burstMs}ms`;
          liveFirework.appendChild(b);
        });
      });

      liveFirework.classList.add("show");
      setTimeout(() => {
        liveFirework.classList.add("center-hidden");
      }, Math.max(0, timing.firstBurstDelayMs - 80));
      liveFireworkTimer = setTimeout(() => {
        liveFirework.classList.remove("show", "center-hidden");
        liveFirework.innerHTML = "";
        liveFireworkActive = false;
        runNextLiveFirework();

        giftVideo.muted = true; // Always start muted

        // iOS: use canvas rendering to remove black background from MP4
        // Lion upgrade: use canvas only for fade-out (already has alpha)
        // On Android, skip canvas for lion upgrade — native VP9 alpha is hardware-decoded
        const isLionUpgSrc = useLionUpgrade && src === lionUpgradeBlobUrl;
        const isDragonSrc = giftId === "dragon" && src.includes("dragonanimation.webm");
        const isAndroid = /Android/i.test(navigator.userAgent);
        /* Side-by-side alpha matte (Corgi etc.): the gift declares it in the
           library; needs the canvas path on every platform to recombine the
           colour + mask halves. */
        const isSideBySide = !!gift.sideBySideAlpha;
        /* Soft matte = full-frame / gradient-fade gifts (e.g. Hero Space Ship)
           whose mask fades smoothly top→bottom rather than being a tight cut-out.
           For these we must NOT apply the silhouette edge-key (hard cutoff +
           dark-pixel removal) or the gradient turns into a hard rectangular edge
           and the dark scene gets eaten. */
        const isSoftMatte = !!gift.softMatte;
        const useCanvas = isSideBySide || (isLionUpgSrc && !isAndroid) || isDragonSrc || (isIOS && (src.endsWith(".mp4") || src.includes(".mp4?"))) || src.includes("pegasus.mp4") || src.includes("thunderfalcon.mp4") || src.includes("firedragon3.mp4") || src.includes("blackdragon.mp4") || src.includes("blackalien.mp4") || src.includes("kingleonard") || src.includes("firephoenix.mov") || src.includes("futurecity.mov");
        /* Always start from ONE fresh canvas. Reusing or leaving an old canvas
           lets a previous gift's last frame stay stacked behind this one, which
           showed as a faint offset "shadow" duplicate on repeated/queued sends.
           Also kill any draw loop still scheduled from a prior gift. */
        if (giftDrawRaf) { cancelAnimationFrame(giftDrawRaf); giftDrawRaf = null; }
        // Clear each old canvas's pixels BEFORE removing it, so even a lingering
        // GPU layer is blank, then remove it. No stacking, no ghost frame.
        giftOverlay.querySelectorAll(".gift-canvas").forEach((c) => { try { c.width = 0; } catch (e) {} c.remove(); });
        let giftCanvas = null;
        let canvasRaf = null;

        if (useCanvas) {
          giftVideo.classList.add("use-canvas");
          /* Belt-and-suspenders: force the raw <video> hidden inline too (not
             just via the shadow-root class), so a side-by-side gift can never
             show its black-background full frame behind the canvas. */
          giftVideo.style.opacity = "0";
          giftVideo.style.width = "1px";
          giftVideo.style.height = "1px";
          giftVideo.style.position = "absolute";
          giftCanvas = document.createElement("canvas");
          giftCanvas.className = "gift-canvas";
          giftOverlay.appendChild(giftCanvas);
          giftCanvas.style.position = "absolute";
          giftCanvas.style.left = "0";
          giftCanvas.style.bottom = "0";
          giftCanvas.style.width = "100%";
          giftCanvas.style.height = giftAspectCanvasPx > 0 ? `${giftAspectCanvasPx}px` : (useBottomAnchoredTallGift ? "200%" : "100%");
          const ctx = giftCanvas.getContext("2d", { willReadFrequently: true });

          const drawFrame = () => {
            if (seq !== giftPlaySeq || !giftVideo || giftVideo.paused || giftVideo.ended) {
              return;
            }
            const vw = giftVideo.videoWidth || 480;
            const vh = giftVideo.videoHeight || 480;
            if (!isSideBySide) {
              if (giftCanvas.width !== vw) giftCanvas.width = vw;
              if (giftCanvas.height !== vh) giftCanvas.height = vh;
            }

            if (isSideBySide) {
              /* ---- Side-by-side alpha matte (Corgi): left half = colour,
                 right half = white silhouette → use its brightness as alpha. ---- */
              /* GUARD: if the video hasn't reported its real size yet, the 480
                 fallback would split at 240 — reading garbage (colour region) as
                 the "mask" and producing a black/duplicate frame. Skip until the
                 true width is known. This is the intermittent-black race. */
              if (!giftVideo.videoWidth || !giftVideo.videoHeight) {
                canvasRaf = giftDrawRaf = requestAnimationFrame(drawFrame);
                return;
              }
              const halfW = Math.floor(vw / 2);
              if (giftCanvas.width !== halfW) giftCanvas.width = halfW;
              if (giftCanvas.height !== vh) giftCanvas.height = vh;
              /* Capture the WHOLE frame in ONE drawImage into an offscreen canvas,
                 then read both halves from that single snapshot. Drawing the two
                 halves separately could sample two DIFFERENT video frames (the GPU
                 advances the video between the calls), offsetting the colour from
                 the mask and producing the intermittent black blob. One capture =
                 colour and mask always the same frame. */
              if (!_sbsCapCanvas) {
                _sbsCapCanvas = document.createElement("canvas");
                _sbsCapCtx = _sbsCapCanvas.getContext("2d", { willReadFrequently: true });
              }
              if (_sbsCapCanvas.width !== vw) _sbsCapCanvas.width = vw;
              if (_sbsCapCanvas.height !== vh) _sbsCapCanvas.height = vh;
              _sbsCapCtx.drawImage(giftVideo, 0, 0, vw, vh);
              const full = _sbsCapCtx.getImageData(0, 0, vw, vh).data;

              /* These mattes are PREMULTIPLIED (colour blended toward black at the
                 soft edges). Canvas ImageData is straight alpha, so we un-premultiply
                 (colour ÷ alpha) to avoid a dark halo, drop tiny-alpha noise, and
                 fade dark see-through edges so there's no fringe (eyes/nose stay
                 because they're SOLID). 0.18s fade-in hides the spawn; last 1s fades out. */
              const ctSB = giftVideo.currentTime;
              const durSB = Number(giftVideo.duration || 0);
              let envelope = 1;
              const FADE_IN = 0.18;
              if (ctSB < FADE_IN) { const t = ctSB / FADE_IN; envelope = t * t; }
              if (durSB > 0) {
                const tl = durSB - ctSB;
                if (tl < 1) envelope = Math.min(envelope, Math.max(0, tl / 1));
              }
              const out = ctx.createImageData(halfW, vh);
              const od = out.data;
              // Tight silhouette gifts trim a faint fringe (CUT 52) and key dark
              // see-through edges. Soft-matte gifts keep the smooth gradient: only
              // drop pure-black background noise and never touch dark pixels.
              const CUT = isSoftMatte ? 4 : 52;
              const SPREAD = 255 / (255 - CUT);
              for (let y = 0; y < vh; y++) {
                const rowC = y * vw * 4;          // colour row start (left half)
                const rowM = rowC + halfW * 4;    // mask row start (right half)
                const rowO = y * halfW * 4;       // output row start
                for (let x = 0; x < halfW; x++) {
                  const ci = rowC + x * 4;
                  const mi = rowM + x * 4;
                  const oi = rowO + x * 4;
                  const a = full[mi] * 0.299 + full[mi + 1] * 0.587 + full[mi + 2] * 0.114;
                  if (a < CUT) { od[oi + 3] = 0; continue; } // bg / noise → transparent
                  const inv = 255 / a;
                  let r = full[ci] * inv, g = full[ci + 1] * inv, b = full[ci + 2] * inv;
                  r = r > 255 ? 255 : r; g = g > 255 ? 255 : g; b = b > 255 ? 255 : b;
                  od[oi] = r; od[oi + 1] = g; od[oi + 2] = b;
                  let outA = (a - CUT) * SPREAD;
                  if (!isSoftMatte && outA < 235) {
                    const luma = r * 0.299 + g * 0.587 + b * 0.114;
                    let dk = (luma - 70) * 0.0125; // /80: luma<=70 → 0, >=150 → 1
                    dk = dk < 0 ? 0 : dk > 1 ? 1 : dk;
                    outA *= dk;
                  }
                  od[oi + 3] = (outA * envelope) | 0;
                }
              }
              ctx.putImageData(out, 0, 0);
              canvasRaf = giftDrawRaf = requestAnimationFrame(drawFrame);
              return;
            }

            if (isLionUpgSrc || isDragonSrc) {
              /* ---- Lion upgrade / Dragon: already transparent, only do fade-out ---- */
              ctx.clearRect(0, 0, vw, vh);
              const duration = Number(giftVideo.duration || 0);
              const timeLeft = duration > 0 ? duration - giftVideo.currentTime : Infinity;
              if (timeLeft <= 1) {
                ctx.globalAlpha = Math.max(0, Math.min(1, timeLeft / 1));
              } else {
                ctx.globalAlpha = 1;
              }
              ctx.drawImage(giftVideo, 0, 0, vw, vh);
              ctx.globalAlpha = 1;
              canvasRaf = giftDrawRaf = requestAnimationFrame(drawFrame);
              return;
            }

            ctx.drawImage(giftVideo, 0, 0, vw, vh);
            const isLionMp4 = isIOS && src.includes("lionAnimation.mp4");
            const isThunder = src.includes("thunderfalcon.mp4");
            const isFireDragon = src.includes("firedragon3.mp4");
            const isBlackDragon = src.includes("blackdragon.mp4");
            const isBlackAlien = src.includes("blackalien.mp4");
            const isKingLeo = src.includes("kingleonard");
            const isFirePhoenix = src.includes("firephoenix.mov");
            const isFutureCity = src.includes("futurecity.mov");
            /* Blur the top 25% — hides compression artifacts in the black header
               band on pegasus/thunder/lion. King Leonardo skips this so its top
               is a clean alpha-fade only (matches the "Fade from top" CSS mask). */
            if (src.includes("pegasus.mp4") || isThunder || isLionMp4) {
              const blurH = Math.floor(vh * 0.25);
              ctx.filter = "blur(4px)";
              ctx.drawImage(giftVideo, 0, 0, vw, blurH, 0, 0, vw, blurH);
              ctx.filter = "none";
            }
            // Remove black pixels: make them transparent
            const imageData = ctx.getImageData(0, 0, vw, vh);
            const d = imageData.data;
            const isPegasus = src.includes("pegasus.mp4");
            const isLionKey = isLionMp4;
            const threshold = isLionKey ? 45 : 30; // stronger key for lion mp4
            if (isPegasus || isThunder || isFireDragon || isBlackDragon || isBlackAlien || isKingLeo || isFirePhoenix || isFutureCity) {
              /* Fade all pixels from 0% → 100% opacity across the top band.
                 King Leonardo / Fire Phoenix / Future City honour the Mode 2
                 "Fade from top" slider; the black-key gifts (pegasus, thunder,
                 dragons, alien) keep their tuned 30% so their header band stays
                 clean. */
              const _sliderFade = Number(roomStyle.animationFadeTopPercent);
              const _sliderFadePct = (Number.isFinite(_sliderFade) ? Math.max(0, Math.min(100, _sliderFade)) : 10) / 100;
              const fadePct = (isKingLeo || isFirePhoenix || isFutureCity) ? _sliderFadePct : 0.30;
              const fadeAllH = Math.floor(vh * fadePct);
              for (let y = 0; y < fadeAllH; y++) {
                const fadeAll = y / Math.max(1, fadeAllH);
                for (let x = 0; x < vw; x++) {
                  const i = (y * vw + x) * 4;
                  d[i+3] = Math.round(d[i+3] * fadeAll);
                }
              }
            } else if (isLionKey) {
              const topBlackH = Math.floor(vh * 0.2);
              const fadeBlackH = Math.floor(vh * 0.4);
              for (let y = 0; y < fadeBlackH; y++) {
                const fade = y < topBlackH ? 0 : (y - topBlackH) / Math.max(1, fadeBlackH - topBlackH);
                for (let x = 0; x < vw; x++) {
                  const i = (y * vw + x) * 4;
                  const brightness = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
                  if (brightness < threshold) {
                    d[i+3] = Math.round(255 * fade);
                  }
                }
              }

              // Fade all pixels from 0% to 100% opacity across top 40%
              const fadeAllH = Math.floor(vh * 0.4);
              for (let y = 0; y < fadeAllH; y++) {
                const fadeAll = y / Math.max(1, fadeAllH);
                for (let x = 0; x < vw; x++) {
                  const i = (y * vw + x) * 4;
                  d[i+3] = Math.round(d[i+3] * fadeAll);
                }
              }
            } else {
              for (let i = 0; i < d.length; i += 4) {
                const brightness = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
                if (brightness < threshold) {
                  d[i+3] = 0; // fully transparent
                } else if (brightness < threshold * 2) {
                  // Smooth transition for near-black pixels
                  d[i+3] = Math.round((brightness - threshold) / threshold * 255);
                }
              }
            }

            // Fade out during the last 1 second of the animation
            const duration = Number(giftVideo.duration || 0);
            if (duration > 0) {
              const timeLeft = duration - giftVideo.currentTime;
              if (timeLeft <= 1) {
                const fadeOut = Math.max(0, Math.min(1, timeLeft / 1));
                for (let i = 0; i < d.length; i += 4) {
                  d[i+3] = Math.round(d[i+3] * fadeOut);
                }
              }
            }
            ctx.putImageData(imageData, 0, 0);
            canvasRaf = giftDrawRaf = requestAnimationFrame(drawFrame);
          };

          // Start drawing when video plays
          giftVideo.addEventListener("playing", () => {
            drawFrame();
          }, { once: true });

          // Clean up canvas on end
          const origOnEnded = giftVideo.onended;
          giftVideo.onended = () => {
            if (canvasRaf) cancelAnimationFrame(canvasRaf);
            if (giftCanvas && giftCanvas.parentNode) giftCanvas.parentNode.removeChild(giftCanvas);
            if (origOnEnded) origOnEnded();
          };
        } else {
          // Remove canvas if present (non-iOS)
          if (giftCanvas && giftCanvas.parentNode) giftCanvas.parentNode.removeChild(giftCanvas);
          giftVideo.classList.remove("use-canvas");

          // CSS fade-out for lion (no canvas, just fade opacity)
          if (giftId === 'lion') {
            giftVideo.style.transition = "none";
            giftVideo.style.opacity = "";
            const fadeHandler = () => {
              if (seq !== giftPlaySeq || !giftVideo) return;
              const dur = Number(giftVideo.duration || 0);
              if (dur > 0) {
                const timeLeft = dur - giftVideo.currentTime;
                if (timeLeft <= 1 && !giftVideo._fadeStarted) {
                  giftVideo._fadeStarted = true;
                  giftVideo.style.transition = "opacity 1s linear";
                  giftVideo.style.opacity = "0";
                }
              }
            };
            giftVideo.addEventListener("timeupdate", fadeHandler);
            const origEnd2 = giftVideo.onended;
            giftVideo.onended = () => {
              giftVideo.removeEventListener("timeupdate", fadeHandler);
              giftVideo.style.transition = "none";
              giftVideo.style.opacity = "";
              delete giftVideo._fadeStarted;
              if (origEnd2) origEnd2();
            };
          }
        }

        /* Use cached blob URL if available, else fall back to server URL */
        giftVideo.src = resolveAssetUrl(src);
        giftVideo.load();

        if (dragonStartOffsetSec > 0) {
          giftVideo.addEventListener("loadedmetadata", () => {
            try {
              if (Number.isFinite(giftVideo.duration) && giftVideo.duration > dragonStartOffsetSec) {
                giftVideo.currentTime = dragonStartOffsetSec;
              }
            } catch (err) { /* ignore seek errors */ }
          }, { once: true });
        }

        // Wait for canplaythrough (most reliable on iOS)
        let playAttempted = false;
        const attemptPlay = () => {
          if (playAttempted || seq !== giftPlaySeq) return;
          playAttempted = true;
          giftVideo.play().then(() => {
            if (seq !== giftPlaySeq) return;
            console.log("Video playing");
            if (giftVideo) giftVideo.classList.add("playing");
            /* Strip src from DOM so inspecting the element does not reveal the blob URL */
            /* Keep active media src attached until playback completes (iOS). */
            /* Unmute for gifts with embedded audio (skip when forceMuteVideo
               is set — e.g. King Leonardo plays a separate audio track) */
            if (useEmbeddedGiftSound && giftVideo && !forceMuteVideo) {
              giftVideo.muted = false;
              giftVideo.volume = getAnimationAudioVolume();
            }
            startHideTimer();
          }).catch(() => {
            // Stay muted if play fails
            giftVideo.muted = true;
            giftVideo.play().then(() => {
              if (seq !== giftPlaySeq) return;
              console.log("Video playing (muted)");
              if (giftVideo) giftVideo.classList.add("playing");
              /* Keep active media src attached until playback completes (iOS). */
              startHideTimer();
            }).catch((err2) => {
              console.error("Play completely failed:", err2);
              if (freezeWatchdogId) clearInterval(freezeWatchdogId);
              tryNext();
            });
          });
        };

        giftVideo.addEventListener("canplaythrough", attemptPlay, { once: true });
        // Also listen for canplay as fallback
        giftVideo.addEventListener("canplay", () => {
          setTimeout(attemptPlay, 50);
        }, { once: true });
        // Fallback timeout — if nothing happens in 4s, force play
        setTimeout(attemptPlay, 4000);
      };

      tryNext();
    }

    /* Handle a user-picked video file for a seat.
       Saves the blob in IDB (keyed by the seat's handle) so it survives
       reload, creates a Blob URL, persists `seats` and re-applies styles. */
    async function handleSeatVideoUpload(idx, file) {
      if (!file || !file.type || !file.type.startsWith("video/")) return;
      const seat = seats[idx];
      if (!seat) return;
      const handle = normalizeHandle(seat.handle || seat.name || "");
      if (!handle) return;
      try {
        await saveSeatVideoBlob(handle, file);
      } catch (err) {
        console.warn("Seat video save failed", err);
      }
      // Revoke any previous URL for this handle before allocating a new one
      if (seatVideoBlobUrls.has(handle)) {
        try { URL.revokeObjectURL(seatVideoBlobUrls.get(handle)); } catch (err) { /* ignore */ }
      }
      seatVideoBlobUrls.set(handle, URL.createObjectURL(file));
      seat.videoMode = true;
      // Mark as user-uploaded; do NOT overwrite seat.videoSrc so the default
      // path (e.g. savetik.MP4) is preserved as a fallback if IDB is cleared
      try { localStorage.setItem(seatsStoreKey, JSON.stringify(seats)); } catch (err) { /* ignore */ }
      applyRoomStyle();
    }

    function formatSeatName(raw, fontSize) {
      if (!raw) return "";
      const trimmed = raw.trim();
      const chars = [...trimmed];
      const limit = (fontSize >= 12) ? 5 : 7;
      if (chars.length > limit) return chars.slice(0, limit).join("") + "...";
      return trimmed;
    }

    function formatSeatPoints(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return "0";
      const pointsFormat = String(roomStyle?.pointsFormat || "compact").toLowerCase();
      if (pointsFormat === "full") {
        return Math.round(num).toLocaleString();
      }
      const abs = Math.abs(num);
      if (abs >= 1_000_000) {
        const scaled = num / 1_000_000;
        const truncated = scaled >= 0
          ? Math.floor(scaled * 10) / 10
          : Math.ceil(scaled * 10) / 10;
        return `${truncated.toFixed(1)}M`;
      }
      if (abs >= 1_000) {
        const scaled = num / 1_000;
        const truncated = scaled >= 0
          ? Math.floor(scaled * 10) / 10
          : Math.ceil(scaled * 10) / 10;
        return `${truncated.toFixed(1)}K`;
      }
      return Math.round(num).toString();
    }

    const seatProfileCache = new Map();
    const seatProfileInFlight = new Set();
    /* Avatar-less lookups are retried instead of being cached forever: an early
       failure (server WAF-blocked, worker slow) used to poison seatProfileCache
       with {avatar:""}, and because the read path only checked `.has(handle)`
       the seat could never recover for the life of the page — mode2 showed the
       profile while mode1 stayed blank. Retries are bounded + backed off so
       repeated renders cannot spam the endpoint. */
    const seatProfileRetry = new Map(); // handle -> { tries, nextAt }

    function canRequestUserMedia() {
      return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    }

    function stopMicMonitor() {
      if (micRaf) {
        cancelAnimationFrame(micRaf);

      }
      if (micSource) {
        try { micSource.disconnect(); } catch (err) { /* ignore */ }
        micSource = null;

      micAnalyser = null;
      micData = null;
      micActive = false;

    /* ── Auto blink border ──────────────────────────────────────────────
       Some clients' mics can't be detected (no audio track / blocked
       permission), so the blue speaking border never lights up. When mode2
       turns this on, pulse the border on a timer instead. Default OFF. */
    let autoBlinkBorderEnabled = false;
    let autoBlinkTimer = null;
    const AUTO_BLINK_ON_MS = 900;   // border visible
    const AUTO_BLINK_OFF_MS = 600;  // border hidden

    function autoBlinkActive() {
      // Mirrors the mic monitor's conditions so the two behave identically.
      return autoBlinkBorderEnabled && speakingBorderVisible && seatStyleMode !== 4;
    }

    function stopAutoBlinkBorder() {
      if (autoBlinkTimer) { clearTimeout(autoBlinkTimer); autoBlinkTimer = null; }
      if (videoWrap) videoWrap.classList.remove("cam-speaking");
    }

    function applyAutoBlinkBorder() {
      stopAutoBlinkBorder();
      if (!autoBlinkActive()) return;
      const step = (on) => {
        if (!autoBlinkActive()) { stopAutoBlinkBorder(); return; }
        if (videoWrap) videoWrap.classList.toggle("cam-speaking", on);
        autoBlinkTimer = setTimeout(() => step(!on), on ? AUTO_BLINK_ON_MS : AUTO_BLINK_OFF_MS);
      };
      step(true);
    }

    function setupMicMonitorFromStream(nextStream) {
      if (!nextStream) return;
      const audioTracks = typeof nextStream.getAudioTracks === "function" ? nextStream.getAudioTracks() : [];
      if (!audioTracks.length) return;
      stopMicMonitor();
      micStream = nextStream;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!micCtx || micCtx.state === "closed") {
        micCtx = new AudioCtx();
      }
      if (micCtx.state === "suspended") {
        micCtx.resume().catch(() => {});
      }
      micSource = micCtx.createMediaStreamSource(nextStream);
      micAnalyser = micCtx.createAnalyser();
      micAnalyser.fftSize = 512;
      micData = new Uint8Array(micAnalyser.fftSize);
      micSource.connect(micAnalyser);
      micActive = true;
      const tick = () => {
        if (!micAnalyser || !micData) return;
        micAnalyser.getByteTimeDomainData(micData);
        let sum = 0;
        for (let i = 0; i < micData.length; i++) {
          const v = (micData[i] - 128) / 128;
          sum += v * v;
        }
        const rms = Math.sqrt(sum / micData.length);
        const speaking = rms > 0.04;
        // When auto-blink drives the border, don't let the mic tick fight it.
        if (videoWrap && !autoBlinkActive()) {
          videoWrap.classList.toggle("cam-speaking", speaking && speakingBorderVisible && seatStyleMode !== 4);
        }
        micRaf = requestAnimationFrame(tick);
      };
      tick();
    }

    async function startCamera() {
      if (!canRequestUserMedia()) {
        console.warn("Camera/mic requires a secure context. Open this page from localhost/HTTPS instead of 0.0.0.0.");
        setCamStatus("Camera unavailable — open the app over HTTPS or localhost (not an IP address).");
        return;
      }
      try {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
      } catch (err) { /* ignore */ }
      const videoConstraint = { facingMode: { ideal: currentFacingMode } };
      try {
        // Request audio only if the mic is on; if the combined request fails
        // (e.g. no/blocked microphone) fall back to video-only so the camera
        // still shows instead of a black screen.
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint, audio: micEnabled });
        } catch (errCombined) {
          if (micEnabled) {
            stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint, audio: false });
          } else {
            throw errCombined;
          }
        }
        micStream = stream;
        if (micEnabled && stream.getAudioTracks().length) setupMicMonitorFromStream(stream);
        videoEl.srcObject = stream;
        const playPromise = videoEl.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(() => {});
        }
        setCamStatus("");
      } catch (err) {
        const name = err && err.name ? err.name : String(err);
        console.warn("Camera/mic access failed:", name);
        const denied = /NotAllowed|SecurityError|Permission/i.test(name);
        setCamStatus(denied
          ? "Camera blocked — allow camera access for this app in your system settings."
          : "Camera unavailable — no camera was found or it's in use by another app.");
      }
    }

    function isStreamActive() {
      if (!stream || typeof stream.getTracks !== "function") return false;
      return stream.getTracks().some((track) => track.readyState === "live");
    }

    function startMicMonitor() {
      if (micActive) return;
      if (stream && typeof stream.getAudioTracks === "function" && stream.getAudioTracks().some((track) => track.readyState === "live")) {
        setupMicMonitorFromStream(stream);
        return;
      }
      if (!canRequestUserMedia()) return;
      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        setupMicMonitorFromStream(stream);
      }).catch(() => {
        micActive = false;
      });
    }

    function ensureMicStart() {
      if (micEnabled && !micActive) startMicMonitor();
      if (!isStreamActive()) startCamera();
      if (micEnabled && micCtx && micCtx.state === "suspended") {
        micCtx.resume().catch(() => {});
      }
    }
    ["pointerdown", "touchstart", "click"].forEach((evt) => {
      document.addEventListener(evt, ensureMicStart, { passive: true });
    });

    function toggleCameraFacing() {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      try { localStorage.setItem(camFacingStoreKey, currentFacingMode); } catch (err) { /* ignore */ }
      startCamera();
    }

    /* Sentinel persisted when the host explicitly removes the cam background.
       It means "show the live camera, NOT the default cam-bg video" and lets the
       load path tell an intentional removal apart from a never-configured cam
       (empty string), which still falls back to the default video. */
    const CAM_BG_NONE = "__none__";

    /* Re-point the <video> at the live stream if it got detached (e.g. a bg was
       shown earlier, which nulls srcObject). Fixes the black screen after the
       background is removed while a stream is still live. */
    function ensureVideoStreamAttached() {
      if (videoEl && stream && videoEl.srcObject !== stream) {
        videoEl.srcObject = stream;
        const p = videoEl.play();
        if (p && typeof p.catch === "function") p.catch(() => {});
      }
    }

    function setCamBackground(dataUrl, opts = {}) {
      if (!camBgEl && !camBgVideoEl) return;

      const isNone = dataUrl === CAM_BG_NONE;
      const visualUrl = isNone ? "" : (dataUrl || "");

      // Detect if this is a video. blob: object URLs carry no mime/extension
      // hint, so the picker/restore pass opts.isVideo explicitly.
      const isVideo = visualUrl && (
        opts.isVideo === true ||
        visualUrl.startsWith("data:video/") ||
        !!visualUrl.match(/\.(mp4|webm|mov|avi|mkv)$/i)
      );

      if (visualUrl) {
        if (isVideo) {
          // Hide image, show video
          if (camBgEl) {
            camBgEl.src = "";
            camBgEl.style.display = "none";
          }
          if (camBgVideoEl) {
            camBgVideoEl.src = visualUrl;
            camBgVideoEl.style.display = "block";
            camBgVideoEl.play().catch(() => {});
          }
        } else {
          // Hide video, show image
          if (camBgVideoEl) {
            camBgVideoEl.pause();
            camBgVideoEl.src = "";
            camBgVideoEl.style.display = "none";
          }
          if (camBgEl) {
            camBgEl.src = visualUrl;
            camBgEl.style.display = "block";
          }
        }
        // Stop camera stream only if VRM is NOT enabled
        if (!camVrmEnabled && stream) {
          try { stream.getTracks().forEach((track) => track.stop()); } catch (err) { /* ignore */ }
          stream = null;
          if (videoEl) videoEl.srcObject = null;
        } else if (camVrmEnabled && !isStreamActive()) {
          startCamera();
        }
      } else {
        // No background → show the live camera.
        if (camBgEl) {
          camBgEl.src = "";
          camBgEl.style.display = "none";
        }
        if (camBgVideoEl) {
          camBgVideoEl.pause();
          camBgVideoEl.src = "";
          camBgVideoEl.style.display = "none";
        }
        if (!isStreamActive()) startCamera();
        else ensureVideoStreamAttached();
      }
      applyCamVisibility();

      // Display-only calls (restoring from disk/server) skip persistence.
      if (opts.persist === false) return;

      /* Persist a tiny MARKER on this device only. The actual video Blob is
         kept in IndexedDB by the picker — we no longer ship it to the server
         or Cloudinary. Legacy remote/data URLs (e.g. an old Cloudinary URL)
         are still remembered as-is so existing users don't lose their bg. */
      let marker;
      if (isNone) marker = CAM_BG_NONE;
      else if (opts.localBlob) marker = CAM_BG_IDB;
      else if (visualUrl && !visualUrl.startsWith("blob:")) marker = visualUrl;
      else marker = "";
      try { localStorage.setItem(camBgStoreKey, marker); } catch (err) { /* ignore */ }
      /* Auto-save the rest of the layout (small JSON, no video) so users who
         forget Save Layout in mode2 still keep their other tweaks. */
      debounceSaveLayout();
    }

    /* Restore the cam background from this device (IndexedDB) on load. Returns
       true if it applied something, false if there's nothing saved locally. */
    async function restoreCamBgFromLocal() {
      let marker = "";
      try { marker = localStorage.getItem(camBgStoreKey) || ""; } catch (err) { /* ignore */ }
      if (marker === CAM_BG_NONE) { setCamBackground(CAM_BG_NONE, { persist: false }); return true; }
      if (marker === CAM_BG_IDB) {
        try {
          const blob = await mediaStore.get(CAM_BG_DB_KEY);
          if (blob) {
            if (camBgObjectUrl) { try { URL.revokeObjectURL(camBgObjectUrl); } catch (e) {} }
            camBgObjectUrl = URL.createObjectURL(blob);
            setCamBackground(camBgObjectUrl, { persist: false, isVideo: String(blob.type || "").startsWith("video/") });
            return true;
          }
        } catch (err) { /* ignore */ }
      }
      if (marker && marker !== CAM_BG_IDB) { // legacy small remote/data URL
        setCamBackground(marker, { persist: false });
        return true;
      }
      return false;
    }

    /* Default cam background video. Applied only when no saved bg (server or
       localStorage) exists. Sets the element src directly so user "Remove"
       still works and persists the empty state. */
    const DEFAULT_CAM_BG_VIDEO = "image/cam-bg-screenrec.mov";
    function applyDefaultCamBgVideo() {
      if (!camBgVideoEl) return;
      // Don't override an existing image or video background
      if (camBgEl && camBgEl.src && camBgEl.style.display !== "none") return;
      if (camBgVideoEl.src && camBgVideoEl.style.display !== "none") return;
      camBgVideoEl.src = resolveAssetUrl(DEFAULT_CAM_BG_VIDEO);
      camBgVideoEl.style.display = "block";
      camBgVideoEl.play().catch(() => {});
      if (camBgEl) { camBgEl.src = ""; camBgEl.style.display = "none"; }
      // Stop camera stream if VRM is also off (mirrors setCamBackground behaviour)
      if (!camVrmEnabled && stream) {
        try { stream.getTracks().forEach((track) => track.stop()); } catch (err) { /* ignore */ }
        stream = null;
        if (videoEl) videoEl.srcObject = null;
      }
      applyCamVisibility();
    }

    function setWebBackground(dataUrl, persist = true) {
      const hasBg = typeof dataUrl === "string" && dataUrl.trim().length > 0;
      if (hasBg) {
        const safe = dataUrl.replace(/"/g, '\\"');
        document.body.style.backgroundImage = `url("${safe}")`;
      } else {
        document.body.style.backgroundImage = "none";
      }
      if (persist) {
        try { localStorage.setItem(webBgStoreKey, hasBg ? dataUrl : ""); } catch (err) { /* ignore */ }
        saveWebBgToServer(hasBg ? dataUrl : "");
      }
    }

    function setAiAvatar(url) {
      camAiAvatarUrl = url || "";
      camAiAvatarReady = false;
      camAiAvatarImage.onload = () => { camAiAvatarReady = true; };
      camAiAvatarImage.onerror = () => { camAiAvatarReady = false; };
      if (camAiAvatarUrl) {
        camAiAvatarImage.src = camAiAvatarUrl;
      } else {
        camAiAvatarImage.src = "";
      }
    }

    function resizeAiCanvas() {
      if (!camAiCanvas || !videoWrap) return;
      camAiCanvas.width = videoWrap.clientWidth;
      camAiCanvas.height = videoWrap.clientHeight;
    }

    function resizeSegCanvas() {
      if (!camSegCanvas || !videoWrap) return;
      camSegCanvas.width = videoWrap.clientWidth;
      camSegCanvas.height = videoWrap.clientHeight;
    }

    function drawAiAvatar(results) {
      if (!camAiCanvas || !camAiCtx) return;
      camAiCtx.clearRect(0, 0, camAiCanvas.width, camAiCanvas.height);
      if (!camAiEnabled || !camAiAvatarReady) return;
      const faces = results && results.multiFaceLandmarks;
      if (!faces || !faces.length) return;
      const landmarks = faces[0];
      let minX = 1, minY = 1, maxX = 0, maxY = 0;
      for (const p of landmarks) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      const w = camAiCanvas.width;
      const h = camAiCanvas.height;
      const faceW = (maxX - minX) * w;
      const faceH = (maxY - minY) * h;
      const centerX = (minX + maxX) * 0.5 * w;
      const centerY = (minY + maxY) * 0.5 * h;
      const scale = 1.4;
      const drawW = faceW * scale;
      const drawH = faceH * scale;
      const x = centerX - drawW / 2;
      const y = centerY - drawH / 2;
      camAiCtx.drawImage(camAiAvatarImage, x, y, drawW, drawH);
    }

    function initFaceMesh() {
      if (faceMesh || typeof FaceMesh === "undefined") return;
      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`,
      });
      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });
      faceMesh.onResults(drawAiAvatar);
    }

    function initSelfieSegmentation() {
      if (selfieSegmentation || typeof SelfieSegmentation === "undefined") return;
      selfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/${file}`,
      });
      selfieSegmentation.setOptions({ modelSelection: 1 });
      selfieSegmentation.onResults((results) => {
        if (!camSegCtx || !camSegCanvas) return;
        camSegCtx.clearRect(0, 0, camSegCanvas.width, camSegCanvas.height);
        if (!camSegEnabled) return;
        if (!results || !results.segmentationMask) return;

        const w = camSegCanvas.width;
        const h = camSegCanvas.height;

        camSegCtx.save();
        camSegCtx.drawImage(results.segmentationMask, 0, 0, w, h);
        camSegCtx.globalCompositeOperation = "source-in";
        camSegCtx.drawImage(results.image, 0, 0, w, h);
        camSegCtx.restore();

        // Draw background image or video behind segmented person
        const hasBgImg = camBgEl && camBgEl.style.display !== "none" && camBgEl.src;
        const hasBgVideo = camBgVideoEl && camBgVideoEl.style.display !== "none" && camBgVideoEl.src;
        if (hasBgImg || hasBgVideo) {
          camSegCtx.globalCompositeOperation = "destination-over";
          if (hasBgVideo) {
            camSegCtx.drawImage(camBgVideoEl, 0, 0, w, h);
          } else {
            camSegCtx.drawImage(camBgEl, 0, 0, w, h);
          }
          camSegCtx.globalCompositeOperation = "source-over";
        }
      });
    }

    async function aiFaceLoop() {
      if (!camAiEnabled || !faceMesh || !videoEl) return;
      if (videoEl.readyState >= 2) {
        try {
          await faceMesh.send({ image: videoEl });
        } catch (err) {
          // Ignore transient face mesh errors
        }
      }
      camAiLoopId = requestAnimationFrame(aiFaceLoop);
    }

    async function segLoop() {
      if (!camSegEnabled || !selfieSegmentation || !videoEl) return;
      if (videoEl.readyState >= 2) {
        try {
          await selfieSegmentation.send({ image: videoEl });
        } catch (err) {
          // Ignore transient segmentation errors
        }
      }
      camSegLoopId = requestAnimationFrame(segLoop);
    }

    function setAiFaceEnabled(next) {

      if (camAiEnabled) {

        resizeAiCanvas();
        if (!camAiLoopId) aiFaceLoop();
      } else if (camAiLoopId) {

    }

    function setSegEnabled(next) {
      camSegEnabled = !!next;
      if (camSegEnabled && typeof SelfieSegmentation === "undefined") {
        camSegEnabled = false;
        if (camSegBtn) camSegBtn.classList.remove("active");
        console.warn("SelfieSegmentation not available; check CDN access.");
        return;
      }
      if (camSegCanvas) camSegCanvas.style.display = camSegEnabled ? "block" : "none";
      if (camSegCtx && !camSegEnabled) camSegCtx.clearRect(0, 0, camSegCanvas.width, camSegCanvas.height);
      if (camSegEnabled) {
        initSelfieSegmentation();
        resizeSegCanvas();
        if (!camSegLoopId) segLoop();
      } else if (camSegLoopId) {
        cancelAnimationFrame(camSegLoopId);
        camSegLoopId = null;
      }
      applyCamVisibility();
    }

    function resizeChromaCanvas() {
      if (!camChromaCanvas || !videoWrap) return;
      camChromaCanvas.width = videoWrap.clientWidth;
      camChromaCanvas.height = videoWrap.clientHeight;
    }

    function chromaKeyLoop() {
      if (!camChromaEnabled || !camChromaCtx || !videoEl) return;
      if (videoEl.readyState < 2) {
        camChromaLoopId = requestAnimationFrame(chromaKeyLoop);
        return;
      }

      const w = camChromaCanvas.width;
      const h = camChromaCanvas.height;

      // Draw camera frame
      camChromaCtx.drawImage(videoEl, 0, 0, w, h);

      // Get image data for chroma keying
      const imageData = camChromaCtx.getImageData(0, 0, w, h);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // Convert RGB to HSV (corrected formula)
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;

        let h = 0;
        if (delta > 0) {
          if (max === r) {
            h = 60 * (((g - b) / delta) % 6);
          } else if (max === g) {
            h = 60 * ((b - r) / delta + 2);
          } else {
            h = 60 * ((r - g) / delta + 4);
          }
          if (h < 0) h += 360;
        }

        const s = max === 0 ? 0 : delta / max; // saturation 0..1
        const v = max / 255;                    // brightness 0..1

        // Skin tone guard: warm hues (red/orange/yellow) — never remove
        const isSkinTone = (h <= 55 || h >= 300) && s > 0.05 && v > 0.1;
        if (isSkinTone) continue;

        // Green detection criteria:
        // 1. Hue in green range (60°–170° covers yellow-green to cyan-green)
        // 2. Green channel is at least close to being dominant
        // 3. Some minimal saturation and brightness
        const greenDominance = g - Math.max(r, b);
        const isGreenHue = h >= 60 && h <= 170;
        const isGreen = isGreenHue && greenDominance > -20 && s > 0.05 && v > 0.08;

        if (isGreen) {
          // More dominant green = more transparent
          // Light green (low sat) still gets removed but with slight fade
          const satFade = Math.min(1, s / 0.3);
          const domFade = Math.min(1, Math.max(0, greenDominance + 20) / 60);
          const fade = Math.max(satFade, domFade);
          data[i + 3] = Math.round((1 - fade) * data[i + 3]);
        }
      }

      camChromaCtx.putImageData(imageData, 0, 0);

      // Draw background behind (destination-over compositing)
      camChromaCtx.globalCompositeOperation = "destination-over";
      if (chromaBgIsVideo && chromaBgVideo && chromaBgVideo.readyState >= 2) {
        camChromaCtx.drawImage(chromaBgVideo, 0, 0, w, h);
      } else if (chromaBgImg && chromaBgImg.complete && chromaBgImg.naturalWidth > 0) {
        camChromaCtx.drawImage(chromaBgImg, 0, 0, w, h);
      }
      camChromaCtx.globalCompositeOperation = "source-over";

      camChromaLoopId = requestAnimationFrame(chromaKeyLoop);
    }

    function setChromaBackground(dataUrl) {
      chromaBgDataUrl = dataUrl || "";
      chromaBgIsVideo = dataUrl && (
        dataUrl.startsWith("data:video/") ||
        dataUrl.match(/\.(mp4|webm|mov|avi|mkv)$/i)
      );

      if (dataUrl) {
        if (chromaBgIsVideo) {
          if (chromaBgImg) chromaBgImg.src = "";
          if (chromaBgVideo) {
            chromaBgVideo.src = dataUrl;
            chromaBgVideo.play().catch(() => {});
          }
        } else {
          if (chromaBgVideo) {
            chromaBgVideo.pause();
            chromaBgVideo.src = "";
          }
          if (chromaBgImg) chromaBgImg.src = dataUrl;
        }
        // Enable chroma key mode
        setChromaEnabled(true);
        // Start camera if not running
        if (!isStreamActive()) startCamera();
      } else {
        // Clear background
        if (chromaBgImg) chromaBgImg.src = "";
        if (chromaBgVideo) {
          chromaBgVideo.pause();
          chromaBgVideo.src = "";
        }
        setChromaEnabled(false);
      }
    }

    function setChromaEnabled(next) {
      camChromaEnabled = !!next;
      if (camChromaCanvas) camChromaCanvas.style.display = camChromaEnabled ? "block" : "none";
      if (camChromaCtx && !camChromaEnabled) camChromaCtx.clearRect(0, 0, camChromaCanvas.width, camChromaCanvas.height);
      if (camChromaEnabled) {
        resizeChromaCanvas();
        if (!camChromaLoopId) chromaKeyLoop();
        // Start camera if not running
        if (!isStreamActive()) startCamera();
      } else if (camChromaLoopId) {
        cancelAnimationFrame(camChromaLoopId);
        camChromaLoopId = null;
      }
      applyCamVisibility();
    }

    function setVrmEnabled(next) {
      camVrmEnabled = !!next;
      if (camVrmCanvas) camVrmCanvas.style.display = camVrmEnabled ? "block" : "none";
      if (window.VRMController && typeof window.VRMController.enable === "function") {
        window.VRMController.enable(camVrmEnabled);
      }
      // If VRM is turned off while background is active, stop camera stream
      const hasBgActive = (camBgEl && camBgEl.style.display !== "none") || (camBgVideoEl && camBgVideoEl.style.display !== "none");
      if (!camVrmEnabled && hasBgActive) {
        if (stream) {
          try { stream.getTracks().forEach((track) => track.stop()); } catch (err) { /* ignore */ }
          stream = null;
          if (videoEl) videoEl.srcObject = null;
        }
      } else if (camVrmEnabled && !isStreamActive()) {
        startCamera();
      }
      applyCamVisibility();
    }

    // Friendly "camera unavailable" message, shown only when the live camera is
    // the layer that *should* be visible (no bg / no VRM avatar / cam on).
    let camStatusMsg = "";
    function setCamStatus(msg) {
      camStatusMsg = msg || "";
      updateCamStatusVisibility();
    }
    function updateCamStatusVisibility() {
      const el = document.getElementById("camStatus");
      if (!el) return;
      const hasBg = !!(camBgEl && camBgEl.style.display !== "none" && camBgEl.src) || !!(camBgVideoEl && camBgVideoEl.style.display !== "none" && camBgVideoEl.src);
      const vrmActive = camVrmEnabled && !!(window.VRMController && typeof window.VRMController.isReady === "function" && window.VRMController.isReady());
      const cameraIsActiveLayer = camVisible && !hasBg && !vrmActive && !camSegEnabled && !camChromaEnabled;
      el.textContent = camStatusMsg;
      el.hidden = !(camStatusMsg && cameraIsActiveLayer);
    }

    function applyCamVisibility() {
      updateCamStatusVisibility();
      const wrap = document.getElementById('videoWrap');
      /* A background counts as present if it's already on screen OR is configured
         on this device (localStorage marker) but still loading. The marker check
         is what stops the host's face from flashing on a hard refresh before the
         bg video finishes loading — the camera stays hidden the whole time. */
      let bgConfigured = false;
      try { const _mk = localStorage.getItem(camBgStoreKey) || ""; bgConfigured = !!_mk && _mk !== CAM_BG_NONE; } catch (e) { /* ignore */ }
      const hasBg = bgConfigured || !!(camBgEl && camBgEl.style.display !== "none" && camBgEl.src) || !!(camBgVideoEl && camBgVideoEl.style.display !== "none" && camBgVideoEl.src);
      if (!camVisible) {
        videoEl.style.opacity = "0";
        if (wrap) {
          wrap.style.visibility = "";
          // Cam off WITH a background → keep the background visible, hide only
          // the live camera. Cam off WITHOUT a background → hide everything.
          if (hasBg) {
            wrap.classList.add("cam-bg-only");
            wrap.classList.remove("cam-hidden");
          } else {
            wrap.classList.add("cam-hidden");
            wrap.classList.remove("cam-bg-only");
          }
          wrap.classList.remove("cam-speaking");
        }
        return;
      }
      if (wrap) {
        wrap.style.visibility = "";
        wrap.classList.remove("cam-hidden");
        wrap.classList.remove("cam-bg-only");
      }
      if (hasBg) {
        videoEl.style.opacity = "0";
        return;
      }
      // VRM only hides the live camera when an avatar is actually loaded —
      // otherwise an enabled-but-empty VRM would leave a black screen.
      const vrmActive = camVrmEnabled
        && !!(window.VRMController && typeof window.VRMController.isReady === "function" && window.VRMController.isReady());
      if (vrmActive || camSegEnabled || camChromaEnabled) {
        videoEl.style.opacity = "0";
      } else {
        videoEl.style.opacity = "1";
      }
    }

    // Re-evaluate cam visibility when a VRM avatar finishes loading or fails.
    window.addEventListener("vrm-ready-change", () => { try { applyCamVisibility(); } catch (e) { /* ignore */ } });

    function setCamVisible(next) {
      camVisible = !!next;
      if (camVisible) {
        if (!isStreamActive()) startCamera();
        else ensureVideoStreamAttached();
      } else if (!camVrmEnabled && stream) {
        /* Cam turned OFF → actually release the webcam so the MacBook camera
           light goes out. (VRM keeps the stream because it needs the feed for
           face tracking.) The cam background, if any, stays visible. */
        try { stream.getTracks().forEach((t) => t.stop()); } catch (e) { /* ignore */ }
        stream = null;
        if (videoEl) videoEl.srcObject = null;
      }
      // If a background video is present, make sure it is actually playing so
      // turning the cam off shows the background instead of a black frame.
      if (!camVisible && camBgVideoEl && camBgVideoEl.style.display !== "none" && camBgVideoEl.src) {
        camBgVideoEl.play().catch(() => {});
      }
      applyCamVisibility();
    }

    function applyCamToolsVisibility() {
      if (camToolsEl) {
        const show = !!(camToolsVisible || webBgToolsVisible || decorateToolsVisible);
        camToolsEl.classList.toggle("show", show);

      if (chromaBgBtn) chromaBgBtn.style.display = camToolsVisible ? "" : "none";
      if (chromaBgClearBtn) chromaBgClearBtn.style.display = camToolsVisible ? "" : "none";
      if (webBgBtn) webBgBtn.style.display = webBgToolsVisible ? "" : "none";

    // ── Decorate button handlers (appear in camTools when Decorate: On) ──
    (function wireDecorateButtons() {
      const decorMediaFile    = document.getElementById("decorMediaFile");
      const decorUploadMediaBtn = document.getElementById("decorUploadMediaBtn");
      const decorAddTextBtnEl = document.getElementById("decorAddTextBtn");
      const decorEditModeBtnEl= document.getElementById("decorEditModeBtn");
      const decorClearAllBtnEl= document.getElementById("decorClearAllBtn");

      let decorEditModeActive = false;

      // Upload image / GIF / video
      if (decorUploadMediaBtn && decorMediaFile) {
        decorUploadMediaBtn.addEventListener("click", () => decorMediaFile.click());
        decorMediaFile.addEventListener("change", async () => {
          const file = decorMediaFile.files && decorMediaFile.files[0];
          if (!file) return;
          decorMediaFile.value = "";
          const isVideo = /^video\//i.test(file.type);
          decorUploadMediaBtn.disabled = true;
          decorUploadMediaBtn.textContent = "Uploading…";
          try {
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(new Error("Read error"));
              reader.readAsDataURL(file);
            });
            const resp = await fetch("/api/upload-decorate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ dataUrl, resourceType: isVideo ? "video" : "image" }),
            });
            const json = await resp.json();
            if (!json.ok || !json.url) throw new Error(json.error || "Upload failed");
            const id = "d_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
            const item = { id, type: isVideo ? "video" : "image", url: json.url };
            if (typeof window.decorAddItem === "function") window.decorAddItem(item);
          } catch (err) {
            alert("Upload failed: " + (err.message || "unknown error"));
          } finally {
            decorUploadMediaBtn.disabled = false;
            decorUploadMediaBtn.textContent = "🖼 Add Image/GIF/Video";
          }
        });
      }

      // Add custom text
      if (decorAddTextBtnEl) {
        decorAddTextBtnEl.addEventListener("click", () => {
          const text = (prompt("Enter decoration text:") || "").trim();
          if (!text) return;
          const id = "d_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
          const item = { id, type: "text", text, color: "#ffffff", size: 48 };
          if (typeof window.decorAddItem === "function") window.decorAddItem(item);
        });
      }

      // Edit mode toggle
      if (decorEditModeBtnEl) {
        decorEditModeBtnEl.addEventListener("click", () => {
          decorEditModeActive = !decorEditModeActive;
          decorEditModeBtnEl.textContent = decorEditModeActive ? "Edit Decorate: On" : "Edit Decorate: Off";
          decorEditModeBtnEl.classList.toggle("active", decorEditModeActive);
          if (typeof window.decorSetEditMode === "function") window.decorSetEditMode(decorEditModeActive);
        });
      }

      // Clear all
      if (decorClearAllBtnEl) {
        decorClearAllBtnEl.addEventListener("click", async () => {
          if (!confirm("Remove all decorations?")) return;
          if (typeof window.decorClearAll === "function") window.decorClearAll();
          // Delete Cloudinary assets and persist empty decorations to server
          try {

    async function restoreVrmFromLocal() {
      let marker = "";

      let blob = null;

        await new Promise((r) => setTimeout(r, 50));

    function crRowEl(row) {
      const el = document.createElement("div");

          el.appendChild(nm);

      addGift(row && row.trigger);
      // Arrow: a custom uploaded image/gif/video (from Mode 2), else the default ➜.
      if (customRewardState.arrowMedia) {
        let am;
        if (customRewardState.arrowType === "video") {
          am = document.createElement("video");
          am.src = customRewardState.arrowMedia;
          am.autoplay = true; am.loop = true; am.muted = true; am.playsInline = true;

        const ar = document.createElement("span");

        el.appendChild(ar);

      addGift(row && row.reward);

    function crVisibleRows() {

    function renderCustomReward() {
      if (!customRewardBox) return;
      const track = document.getElementById("customRewardTrack");
      const rows = crVisibleRows();
      const show = (customRewardState.enabled && rows.length > 0) || editMoveEnabled;
      customRewardBox.classList.toggle("cr-show", show);
      customRewardBox.setAttribute("aria-hidden", show ? "false" : "true");
      if (crBoxTimer) { clearInterval(crBoxTimer); crBoxTimer = null; }
      crRolling = false;
      if (!track) return;
      track.className = "cr-box-track";
      track.style.transform = "";
      track.innerHTML = "";
      if (!rows.length) {
        if (editMoveEnabled) {
          const ph = document.createElement("div");

          nm.className = "cr-box-name";
