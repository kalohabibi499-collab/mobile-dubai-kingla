          ph.appendChild(nm);
          track.appendChild(ph);
        }
        return;
      }
      crBoxIndex = crBoxIndex % rows.length;
      track.appendChild(crRowEl(rows[crBoxIndex]));
      if (rows.length > 1 && customRewardState.enabled) {
        crBoxTimer = setInterval(crAdvanceCustomReward, 3500);
      }
    }

    function crAdvanceCustomReward() {
      const track = document.getElementById("customRewardTrack");
      const rows = crVisibleRows();
      if (!track || crRolling || rows.length < 2) return;
      const nextIndex = (crBoxIndex + 1) % rows.length;
      track.className = "cr-box-track";
      track.style.transform = "";
      track.innerHTML = "";
      track.appendChild(crRowEl(rows[crBoxIndex]));
      track.appendChild(crRowEl(rows[nextIndex]));
      void track.offsetHeight;
      crRolling = true;
      track.classList.add("cr-rolling");
      const done = () => {
        track.removeEventListener("transitionend", done);
        crBoxIndex = nextIndex;
        crRolling = false;
        track.classList.remove("cr-rolling");
        track.style.transform = "";
        track.innerHTML = "";
        track.appendChild(crRowEl(rows[crBoxIndex]));
      };
      track.addEventListener("transitionend", done);
    }

    function handleIncoming(message) {
      if (!message || typeof message !== "object") return;
      if (!shouldProcessMessage(message)) return;
      if (message.type === "ws-ready") {
        // Ask any remote panel already open on another device to resend the
        // current TikTok host profile/name for this same account.
        setTimeout(() => sendMessage({ type: "host-profile-request", needSeats: true }), 300);
        setTimeout(() => scheduleSeatProfileResolveBurst("ws-ready"), 900);
        return;
      }
      if (message.type === "host-profile-sync") {
        const displayName = String(message.name || message.username || "Host").trim() || "Host";
        const username = String(message.username || "").replace(/^@+/, "").trim();
        const avatar = normalizeRemoteAvatarUrl(message.avatar || "");
        liveHostProfile = { name: displayName, avatar, username };
        try {
          if (wsRoomId) localStorage.setItem(getDisplayNameStorageKey(wsRoomId), displayName);
        } catch (e) {}
        const cp = document.getElementById("camNamePill");
        if (cp) cp.textContent = displayName;
        if (username) liveProfileCache.set(username.toLowerCase(), { name: displayName, avatar });
        if (giftSenderAvatar && avatar) giftSenderAvatar.src = avatar;
        if (giftSenderName) giftSenderName.textContent = displayName;
        // Also update the visible small host/seat name if that element exists in
        // the current style. Different style modes use different labels, so be
        // defensive instead of relying on one class.
        try {
          document.querySelectorAll('[data-host-name], .host-name, .cam-name, #camNamePill').forEach((el) => {
            if (el) el.textContent = displayName;
          });
        } catch (e) {}
        return;
      }
      if (message.type === "seat-profile-sync" && message.seat) {
        const incoming = normalizeIncomingSeat(message.seat || {}) || {};
        let idx = Number(message.index);
        const incomingHandle = normalizeHandle(incoming.handle || incoming.name || "");
        if (!Number.isInteger(idx) || idx < 0 || idx >= seatCount) {
          idx = incomingHandle ? seats.findIndex((s) => s && normalizeHandle(s.handle || s.name || "") === incomingHandle) : -1;
        }
        if (idx >= 0 && idx < seatCount) {
          const prev = seats[idx] || {};
          const same = !prev.handle || !incomingHandle || normalizeHandle(prev.handle || prev.name || "") === incomingHandle;
          if (same) {
            seats[idx] = { ...prev, ...incoming, points: Number(incoming.points ?? prev.points ?? 0) || 0 };
            try { localStorage.setItem(seatsStoreKey, JSON.stringify(seats)); } catch (e) {}
            applyRoomStyle();
            scheduleSeatProfileResolveBurst("seat-profile-sync");
          }
        }
        return;
      }
      if (message.type === "remote-command") {
        if (message.action === "open-room") updateRoomUI(true);
        if (message.action === "close-room") updateRoomUI(false);
        if (message.action === "start-camera") startCamera();
        if (message.action === "toggle-mic") {
          micEnabled = !!message.enabled;
          if (stream) {
            const audioTracks = stream.getAudioTracks();
            if (micEnabled && audioTracks.length === 0) {
              startCamera();
            } else if (!micEnabled) {
              audioTracks.forEach((t) => t.stop());
              stopMicMonitor();
            }
          }
        }
        if (message.action === "set-transparent-bg") {
          document.body.classList.toggle("transparent-bg", !!message.enabled);
        }
      } else if (message.type === "edit-mode" && typeof message.enabled === "boolean") {
        editMoveEnabled = message.enabled;
        updateCamBgEditUpload();
        if (animationBox) {
          animationBox.style.borderStyle = message.enabled ? "dashed" : "none";
        }
        if (fireworkBox) {
          fireworkBox.style.borderStyle = message.enabled ? "dashed" : "none";
          fireworkBox.style.pointerEvents = message.enabled ? "auto" : "none";
        }
        if (giftSenderCapsule) {
          const _inner = giftSenderCapsule.querySelector(".gift-sender-capsule-inner");
          if (message.enabled) {
            // Show capsule in edit mode so user can position it
            if (_inner) { _inner.classList.remove("capsule-slide-in", "capsule-slide-out"); }
            giftSenderCapsule.style.display = "";
            giftSenderCapsule.classList.add("edit-capsule");
            giftSenderCapsule.style.pointerEvents = "auto";
            if (giftCapsuleHideTimer) { clearTimeout(giftCapsuleHideTimer); giftCapsuleHideTimer = null; }
          } else {
            giftSenderCapsule.classList.remove("edit-capsule");
            giftSenderCapsule.style.pointerEvents = "none";
            if (_inner) { _inner.classList.remove("capsule-slide-in", "capsule-slide-out"); }
            giftSenderCapsule.style.display = "none";
          }
        }
        if (giftReceivedCard) {
          const _grInner = giftReceivedCard.querySelector(".gift-received-inner");
          if (message.enabled) {
            // Show the GIFT RECEIVED card in edit mode so the user can position/resize it
            if (_grInner) { _grInner.classList.remove("gr-slide-in", "gr-slide-out"); }
            // Populate a sample profile so the card is meaningful while editing
            const _grSample = resolveGiftProfile(-1) || (liveHostProfile && (liveHostProfile.name || liveHostProfile.avatar) ? liveHostProfile : null) || { name: "Supporter", avatar: "", username: "" };
            const _grDefAv = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238b93a6"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/></svg>');
            if (giftReceivedAvatar && !giftReceivedAvatar.getAttribute("src")) giftReceivedAvatar.src = _grSample.avatar || _grDefAv;
            if (giftReceivedName && !giftReceivedName.textContent) giftReceivedName.textContent = _grSample.name || "Supporter";
            giftReceivedCard.classList.add("gr-active", "edit-card");
            giftReceivedCard.style.pointerEvents = "auto";
            if (giftReceivedHideTimer) { clearTimeout(giftReceivedHideTimer); giftReceivedHideTimer = null; }
          } else {
            giftReceivedCard.classList.remove("edit-card");
            giftReceivedCard.style.pointerEvents = "none";
            if (_grInner) { _grInner.classList.remove("gr-slide-in", "gr-slide-out"); }
            if (!giftReceivedHideTimer) giftReceivedCard.classList.remove("gr-active");
          }
        }
        if (customRewardBox) {
          if (message.enabled) {
            customRewardBox.classList.add("edit-card");
            customRewardBox.style.pointerEvents = "auto";
          } else {

          if (window.__editLayoutToggles) window.__editLayoutToggles.hide();
        }
      } else if (message.type === "save-layout") {
        // Save to MongoDB only (no localStorage)
        saveLayoutToServer();
        console.log("Layout saved to MongoDB");
      } else if (message.type === "clear-decorations") {
        if (typeof window.decorClearAll === "function") window.decorClearAll();
      } else if (message.type === "custom-reward-config" && message.config && Array.isArray(message.config.rows)) {
        customRewardState = { enabled: message.config.enabled !== false, rows: message.config.rows, showName: message.config.showName === true, arrowMedia: message.config.arrowMedia || "", arrowType: message.config.arrowType || "" };
        try { localStorage.setItem("tiktok-custom-reward", JSON.stringify(customRewardState)); } catch (err) { /* ignore */ }
        crBoxIndex = 0;
        renderCustomReward();
      } else if (message.type === "remote-style" && message.style) {
        const { _v, uiEditMoveEnabled, uiRoomOpen, uiCamVisible, uiHostTextVisible, uiCamNameVisible, uiSpeakingBorderVisible, uiCamToolsOn, uiTransparentBgOn, uiUploadBgToolOn, ...rest } = message.style;
        roomStyle = { ...roomStyle, ...rest };
        // Apply UI toggle states from mode2
        applyUIState(message.style);
        applyRoomStyle();
        updateRoomUI(roomOpen);
      } else if (message.type === "remote-seats" && Array.isArray(message.seats)) {
        const prevSeats = Array.isArray(seats) ? seats : [];
        const incomingSeats = normalizeSeats(message.seats);
        seats = incomingSeats.map((nextSeat, i) => {
          const prevSeat = prevSeats[i] || null;
          if (!nextSeat || !prevSeat) return nextSeat;
          const prevHandle = normalizeHandle(prevSeat.handle || prevSeat.name || "");
          const nextHandle = normalizeHandle(nextSeat.handle || nextSeat.name || "");
          if (!prevHandle || !nextHandle || prevHandle !== nextHandle) return nextSeat;
          const prevPoints = Number(prevSeat.points);
          const nextPoints = Number(nextSeat.points);
          const safePrev = Number.isFinite(prevPoints) ? prevPoints : 0;
          const safeNext = Number.isFinite(nextPoints) ? nextPoints : 0;
          // Keep the larger total so stale remote-seats packets cannot roll points back.
          return { ...nextSeat, points: Math.max(safePrev, safeNext) };
        });
        seatColors = Array.from({ length: seatCount }, () => null);
        for (let i = 0; i < seatCount; i++) {
          const prev = prevSeats[i] || null;
          const next = seats[i] || null;
          const prevHandle = normalizeHandle(prev?.handle || prev?.name || "");
          const nextHandle = normalizeHandle(next?.handle || next?.name || "");
          if (!next || prevHandle !== nextHandle) {
            clearSeatGiftIcon(i);
            /* Purge queued (not yet playing) animations for this kicked seat.
               The currently playing animation is allowed to finish its loop. */
            for (let q = giftQueue.length - 1; q >= 0; q--) {
              if (giftQueue[q] && giftQueue[q].seatIndex === i) giftQueue.splice(q, 1);
            }
          }
        }
        seats.forEach((seat, idx) => {
          if (seat && seat.avatar) computeSeatColor(idx, seat.avatar);
        });
        try { localStorage.setItem(seatsStoreKey, JSON.stringify(seats)); } catch (err) { /* ignore */ }
        applyRoomStyle();
        scheduleSeatProfileResolveBurst("remote-seats");
      } else if (message.type === "donate-gift" && message.giftId) {

        if (!getGift(message.giftId) && (Array.isArray(message.giftSources) || message.animation)) {
          registerCustomGifts([{
            id: message.giftId,
            name: message.giftName || message.giftId,
            sources: message.giftSources || (message.animation ? [message.animation] : []),
            coins: message.pointsDelta,
            img: message.giftIcon || "",
          }], true);
        }
        const idx = Number(message.seatIndex);
        if (Number.isInteger(idx) && idx >= 0 && idx < seatCount && seats[idx]) {
          // Optional handle check (prevents wrong seat update if remote got out of sync)
          if (!message.seatHandle || seats[idx].handle === message.seatHandle) {
            const delta = Number(message.pointsDelta);
            const current = Number(seats[idx].points);
            const safeCurrent = Number.isFinite(current) ? current : 0;
            const safeDelta = Number.isFinite(delta) ? delta : 0;
            seats[idx].points = safeCurrent + safeDelta;
            try { localStorage.setItem(seatsStoreKey, JSON.stringify(seats)); } catch (err) { /* ignore */ }
            applyRoomStyle();
            showSeatPointsRise(idx, safeDelta);
            if (message.giftId === "lion") {
              showLionSeatIcon(idx);
            } else if (message.giftId === "leonandlion") {
              showLionSeatIcon(idx, "image/leonandlion_tiktok_clean.png");
            } else if (message.giftId === "zeus") {
              showLionSeatIcon(idx, "image/zeusicon.png");
            } else if (message.giftId === "dragon") {
              showLionSeatIcon(idx, "image/dragonicon.png");
            } else if (message.giftId === "pegasus") {
              showLionSeatIcon(idx, "image/pegasus_tiktok_clean.png");

        if (!pinchStartDist) return;
        const scale = dist / pinchStartDist;
        const nextW = Math.max(minSize, Math.round(pinchStartW * scale));
        const nextH = Math.max(minHeight, Math.round(pinchStartH * scale));
        roomStyle[activePrefix + "Width"] = nextW;
        roomStyle[activePrefix + "Height"] = nextH;
        roomStyle[oKey("OffsetX")] = pinchStartOX + Math.round((pinchStartW - nextW) / 2);
        roomStyle[oKey("OffsetY")] = pinchStartOY + Math.round((pinchStartH - nextH) / 2);
        applyRoomStyle();
        broadcastCurrentStyle("host-pinch");
      }, { passive: true });

      el.addEventListener("touchend", () => {
        pinchMode = false;
      }, { passive: true });

      /* ── Group multi-select adapter ──────────────────────────────────────
         Exposes a uniform move/scale interface over this box's per-style
         offset + size/scale keys so the marquee tool can drive several boxes
         together. The firework layer is an effect overlay, not a layout box. */
      const _usesScale = () =>
        (keyPrefix === "room" || keyPrefix === "giftCapsule" ||
         keyPrefix === "giftReceived" || keyPrefix === "customReward");
      function _curRoomScale() {
        return seatStyleMode === 2 ? (roomStyle.roomScale2 ?? 100)
          : seatStyleMode === 3 ? (roomStyle.roomScale3 ?? roomStyle.roomScale1 ?? 100)
          : seatStyleMode === 4 ? (roomStyle.roomScale4 ?? roomStyle.roomScale1 ?? 100)
          : (roomStyle.roomScale1 ?? 100);
      }
      function _setRoomScale(ns) {
        if (seatStyleMode === 2) roomStyle.roomScale2 = ns;
        else if (seatStyleMode === 3) roomStyle.roomScale3 = ns;
        else if (seatStyleMode === 4) roomStyle.roomScale4 = ns;
        else roomStyle.roomScale1 = ns;
      }
      function _readOffset() {
        if (keyPrefix === "cam" && seatStyleMode === 3)
          return { x: Number(roomStyle.style3CamOffsetX) || 0, y: Number(roomStyle.style3CamOffsetY) || 0 };
        return { x: roomStyle[oKey("OffsetX")] ?? 0, y: roomStyle[oKey("OffsetY")] ?? 0 };
      }
      function _writeOffset(x, y) {
        if (keyPrefix === "cam" && seatStyleMode === 3) {
          roomStyle.style3CamOffsetX = x; roomStyle.style3CamOffsetY = y;
        } else {
          roomStyle[oKey("OffsetX")] = x; roomStyle[oKey("OffsetY")] = y;
        }
      }
      /* Screen pixels moved per 1px of offset change. 1 for transform/left-top
         based boxes; equal to the live zoom for the room panel (which is scaled
         via CSS `zoom`, except style-2's bottom-anchored Y which stays 1:1). */
      function _offsetGain() {
        if (keyPrefix !== "room") return { kx: 1, ky: 1 };
        const z = Math.max(0.1, _curRoomScale() / 100);
        return { kx: z, ky: seatStyleMode === 2 ? 1 : z };
      }
      const adapter = {
        el,
        keyPrefix,
        selectable: keyPrefix !== "firework",
        _s: null,
        getRect() { return el.getBoundingClientRect(); },
        isVisible() {
          const r = el.getBoundingClientRect();
          if (r.width < 2 || r.height < 2) return false;
          const cs = getComputedStyle(el);
          return cs.display !== "none" && cs.visibility !== "hidden" && Number(cs.opacity || 1) > 0.01;
        },
        startCapture() {
          const o = _readOffset();
          const s = { ox: o.x, oy: o.y, usesScale: _usesScale() };
          if (keyPrefix === "room") s.scale = _curRoomScale();
          else if (s.usesScale) s.scale = (keyPrefix === "customReward" ? roomStyle.customRewardScale
            : keyPrefix === "giftReceived" ? roomStyle.giftReceivedScale : roomStyle.giftCapsuleScale) ?? 100;
          else {
            const ap = resolveKeyPrefix();
            s.w = roomStyle[ap + "Width"] || el.offsetWidth;
            s.h = roomStyle[ap + "Height"] || el.offsetHeight;
          }
          this._s = s;
        },
        moveByScreen(dx, dy) {
          const { kx, ky } = _offsetGain();
          _writeOffset(this._s.ox + dx / kx, this._s.oy + dy / ky);
        },
        setScaleFactor(f) {
          const s = this._s;
          if (keyPrefix === "room") {
            _setRoomScale(Math.min(300, Math.max(30, Math.round(s.scale * f))));
          } else if (s.usesScale) {
            const ns = Math.min(300, Math.max(20, Math.round(s.scale * f)));
            if (keyPrefix === "customReward") roomStyle.customRewardScale = ns;
            else if (keyPrefix === "giftReceived") roomStyle.giftReceivedScale = ns;
            else roomStyle.giftCapsuleScale = ns;
          } else {
            const ap = resolveKeyPrefix();
            const nw = Math.max(minSize, Math.round(s.w * f));
            const nh = Math.max(minHeight, Math.round(s.h * f));
            roomStyle[ap + "Width"] = nw;
            roomStyle[ap + "Height"] = nh;
            if (keyPrefix === "animation") {
              if (seatStyleMode === 2) { roomStyle.animationWidth2 = nw; roomStyle.animationHeight2 = nh; }
              else if (seatStyleMode === 3) { roomStyle.animationWidth3 = nw; roomStyle.animationHeight3 = nh; }
            }
          }
          _writeOffset(s.ox, s.oy);
        },
        nudgeScreenTo(tx, ty) {
          const { kx, ky } = _offsetGain();
          const r = el.getBoundingClientRect();
          _writeOffset(this._s.ox + (tx - r.left) / kx, this._s.oy + (ty - r.top) / ky);
        },
      };
      el.__groupAdapter = adapter;
      groupAdapters.push(adapter);
    }

    function initChannel() {
      if (channel) {
        channel.addEventListener("message", (event) => handleIncoming(event.data));
      } else {
        window.addEventListener("storage", (event) => {
          if (event.key === fallbackKey && event.newValue) {
            try { handleIncoming(JSON.parse(event.newValue)); } catch (err) { /* ignore */ }
          }
        });
      }
      // Another tab changed the cam-bg marker → re-resolve from this device.
      // (The value is now a small marker, not a raw URL, so route through the
      // local restore which knows how to read the IndexedDB blob.)
      window.addEventListener("storage", (event) => {
        if (event.key === camBgStoreKey) {
          restoreCamBgFromLocal();
        }
      });
      sendMessage({ type: "hello" });
    }

    buildRoomSlots();
    loadSeats();
    // Load layout from MongoDB only (no localStorage fallback)
    (async function loadSavedLayout() {
      await loadLayoutFromServer();
      applyRoomStyle();
      updateRoomUI(roomOpen);
    })();
    enableDragResize(videoWrap, "cam");
    enableDragResize(roomPanel, "room");
    enableDragResize(animationBox, "animation");
    enableDragResize(fireworkBox, "firework");
    if (giftSenderCapsule) enableDragResize(giftSenderCapsule, "giftCapsule");
    if (giftReceivedCard) enableDragResize(giftReceivedCard, "giftReceived");
    if (customRewardBox) enableDragResize(customRewardBox, "customReward");

    /* ── Group multi-select tool ─────────────────────────────────────────
       In edit mode: drag on empty space to draw a marquee and select every
       layout box it touches. Drag inside the selection to move the whole
       group; drag a selection edge/corner to scale the group uniformly about
       the opposite corner (relative spacing is preserved, so boxes keep the
       same arrangement and never overlap when scaled up). Click empty space
       or any unselected box to clear the selection. */
    (function initGroupSelect() {
      const host = document.getElementById("hostLayout");
      if (!host) return;

      const selection = new Set(); // adapters
      let op = null;
      const EDGE = 16;

      const marquee = document.createElement("div");
      marquee.className = "group-marquee";
      marquee.style.display = "none";
      host.appendChild(marquee);

      const gbox = document.createElement("div");
      gbox.className = "group-bbox";
      gbox.style.display = "none";
      ["tl", "tr", "bl", "br"].forEach((p) => {
        const h = document.createElement("div");
        h.className = "gbox-handle " + p;
        gbox.appendChild(h);
      });
      host.appendChild(gbox);

      function selectableAdapters() {
        return groupAdapters.filter((a) => a.selectable && a.isVisible());
      }
      /* Hit-test against EVERY visible draggable box (including non-selectable
         ones like the firework overlay) so clicking such a box hands off to its
         own single drag instead of being mistaken for empty space (marquee). */
      function adapterAtPoint(x, y) {
        let hit = null, hitArea = Infinity;
        for (const a of groupAdapters) {
          if (!a.isVisible()) continue;
          const r = a.getRect();
          if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
            const area = r.width * r.height; // prefer the smallest (topmost-feeling) box
            if (area < hitArea) { hit = a; hitArea = area; }
          }
        }
        return hit;
      }
      function groupRectScreen() {
        let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
        selection.forEach((a) => {
          const q = a.getRect();
          l = Math.min(l, q.left); t = Math.min(t, q.top);
          r = Math.max(r, q.right); b = Math.max(b, q.bottom);
        });
        if (l === Infinity) return null;
        return { left: l, top: t, right: r, bottom: b, width: r - l, height: b - t };
      }
      function updateGroupBox() {
        const gr = groupRectScreen();
        if (!gr) { gbox.style.display = "none"; return; }
        const hr = host.getBoundingClientRect();
        gbox.style.display = "block";
        gbox.style.left = (gr.left - hr.left) + "px";
        gbox.style.top = (gr.top - hr.top) + "px";
        gbox.style.width = gr.width + "px";
        gbox.style.height = gr.height + "px";
      }
      function clearSelection() {
        selection.forEach((a) => a.el.classList.remove("group-selected"));
        selection.clear();
        gbox.style.display = "none";
        window.__groupSelEls = null;
      }
      function setSelection(adapters) {
        clearSelection();
        adapters.forEach((a) => { selection.add(a); a.el.classList.add("group-selected"); });
        window.__groupSelEls = new Set([...selection].map((a) => a.el));
        updateGroupBox();
      }
      window.__clearGroupSelection = clearSelection;

      function startOp(o) {
        op = o;
        window.addEventListener("pointermove", onMove, true);
        window.addEventListener("pointerup", onUp, true);
      }
      function endOp() {
        if (!op) return;
        const type = op.type;
        op = null;
        window.removeEventListener("pointermove", onMove, true);
        window.removeEventListener("pointerup", onUp, true);
        if (type === "marquee") {
          marquee.style.display = "none";
        } else {
          updateGroupBox();
          if (typeof debounceSaveLayout === "function") debounceSaveLayout();
        }
      }

      function onMove(e) {
        if (!op) return;
        const x = e.clientX, y = e.clientY;
        const hr = host.getBoundingClientRect();
        if (op.type === "marquee") {
          const l = Math.min(x, op.sx), t = Math.min(y, op.sy);
          const w = Math.abs(x - op.sx), h = Math.abs(y - op.sy);
          marquee.style.left = (l - hr.left) + "px";
          marquee.style.top = (t - hr.top) + "px";
          marquee.style.width = w + "px";
          marquee.style.height = h + "px";
          op.rect = { left: l, top: t, right: l + w, bottom: t + h };
        } else if (op.type === "move") {
          const dx = x - op.sx, dy = y - op.sy;
          op.items.forEach((it) => it.a.moveByScreen(dx, dy));
          applyRoomStyle();
          if (typeof broadcastCurrentStyle === "function") broadcastCurrentStyle("host-group-move");
          gbox.style.left = (op.gb.left - hr.left + dx) + "px";
          gbox.style.top = (op.gb.top - hr.top + dy) + "px";
        } else if (op.type === "resize") {
          const dx = x - op.sx, dy = y - op.sy;
          const widthDelta = (op.right ? dx : 0) + (op.left ? -dx : 0);
          const heightDelta = (op.bottom ? dy : 0) + (op.top ? -dy : 0);
          const domDelta = Math.abs(widthDelta) >= Math.abs(heightDelta) ? widthDelta : heightDelta;
          let f = op.gb.width > 0 ? (op.gb.width + domDelta) / op.gb.width : 1;
          f = Math.min(5, Math.max(0.2, f));
          // Phase 1: apply the uniform size factor to every selected box.
          op.items.forEach((it) => it.a.setScaleFactor(f));
          applyRoomStyle();
          // Phase 2: scale each box's position about the fixed anchor corner so
          // the relative arrangement is preserved (gaps scale, no overlap).
          op.items.forEach((it) => {
            const tx = op.anchorX + f * (it.rect.left - op.anchorX);
            const ty = op.anchorY + f * (it.rect.top - op.anchorY);
            it.a.nudgeScreenTo(tx, ty);
          });
          applyRoomStyle();
          if (typeof broadcastCurrentStyle === "function") broadcastCurrentStyle("host-group-resize");
          updateGroupBox();
        }
      }
      function onUp() {
        if (op && op.type === "marquee") {
          const r = op.rect;
          if (r && (r.right - r.left > 4 || r.bottom - r.top > 4)) {
            const hits = selectableAdapters().filter((a) => {
              const q = a.getRect();
              return !(q.right < r.left || q.left > r.right || q.bottom < r.top || q.top > r.bottom);
            });
            if (hits.length) setSelection(hits);
          }
        }
        endOp();
      }

      host.addEventListener("pointerdown", (e) => {
        if (!editMoveEnabled) return;
        if (e.pointerType === "mouse" && e.button !== 0) return;
        // Leave real UI controls and the separate decorate layer alone.
        if (e.target.closest("#camTools, button, input, select, textarea, a, #decorLayer")) return;
        const x = e.clientX, y = e.clientY;

        if (selection.size > 0) {
          const gr = groupRectScreen();
          if (gr) {
            const nearL = Math.abs(x - gr.left) <= EDGE, nearR = Math.abs(x - gr.right) <= EDGE;
            const nearT = Math.abs(y - gr.top) <= EDGE, nearB = Math.abs(y - gr.bottom) <= EDGE;
            const inPad = x >= gr.left - EDGE && x <= gr.right + EDGE && y >= gr.top - EDGE && y <= gr.bottom + EDGE;
            const inside = x >= gr.left && x <= gr.right && y >= gr.top && y <= gr.bottom;
            if (inPad && (nearL || nearR || nearT || nearB)) {
              e.preventDefault(); e.stopPropagation();
              const left = nearL && !nearR, right = nearR;
              const top = nearT && !nearB, bottom = nearB;
              const anchorX = left ? gr.right : gr.left;
              const anchorY = top ? gr.bottom : gr.top;
              const items = [...selection].map((a) => { a.startCapture(); return { a, rect: a.getRect() }; });
              startOp({ type: "resize", sx: x, sy: y, left, right, top, bottom, anchorX, anchorY, gb: gr, items });
              return;
            }
            if (inside) {
              e.preventDefault(); e.stopPropagation();
              const items = [...selection].map((a) => { a.startCapture(); return { a }; });
              startOp({ type: "move", sx: x, sy: y, gb: gr, items });
              return;
            }
          }
          clearSelection(); // clicked away from the group → unselect
        }

        const hit = adapterAtPoint(x, y);
        if (!hit) {
          // Empty space → begin a marquee selection.
          e.preventDefault(); e.stopPropagation();
          const hr = host.getBoundingClientRect();
          marquee.style.display = "block";
          marquee.style.left = (x - hr.left) + "px";
          marquee.style.top = (y - hr.top) + "px";
          marquee.style.width = "0px";
          marquee.style.height = "0px";
          startOp({ type: "marquee", sx: x, sy: y, rect: { left: x, top: y, right: x, bottom: y } });
          return;
        }
        // Clicked an unselected box → let its own single drag/resize run.
      }, true);

      window.addEventListener("resize", () => { if (selection.size) updateGroupBox(); });
    })();

    customRewardState = crLoadState();
    renderCustomReward();

    /* ── Per-layout On/Off setters (also keep Mode 2's toggles in sync) ── */
    function setGiftCapsuleVisible(on) {
      giftCapsuleVisible = !!on;
      if (giftSenderCapsule && !giftCapsuleVisible && !editMoveEnabled) giftSenderCapsule.style.display = "none";
      debounceSaveLayout();
      sendMessage({ type: "host-ui-toggle", key: "giftCapsule", on: giftCapsuleVisible });
    }
    function setGiftReceivedVisible(on) {
      giftReceivedVisible = !!on;
      if (giftReceivedCard && !giftReceivedVisible && !editMoveEnabled) {
        if (giftReceivedHideTimer) { clearTimeout(giftReceivedHideTimer); giftReceivedHideTimer = null; }
        giftReceivedCard.classList.remove("gr-active");
      }
      debounceSaveLayout();
      sendMessage({ type: "host-ui-toggle", key: "giftReceived", on: giftReceivedVisible });
    }
    function setFireworkEnabled(on) {
      fireworkEnabled = !!on;
      debounceSaveLayout();
    }
    function setCustomRewardEnabledState(on) {
      customRewardState.enabled = !!on;
      try { localStorage.setItem("tiktok-custom-reward", JSON.stringify(customRewardState)); } catch (e) { /* ignore */ }
      renderCustomReward();
      sendMessage({ type: "host-ui-toggle", key: "customReward", on: customRewardState.enabled });
    }

    /* ── Edit-mode On/Off toggle chips, anchored at each layout's top-left ──
       Overlay buttons (not children of the boxes, so they don't scale with
       them). Only shown while edit mode is on; they follow the boxes live. */
    (function initEditLayoutToggles() {
      const host = document.getElementById("hostLayout");
      if (!host) return;
      const defs = [
        { el: giftSenderCapsule, label: "Gift Capsule", get: () => giftCapsuleVisible, set: setGiftCapsuleVisible },
        { el: giftReceivedCard, label: "Gift Card", get: () => giftReceivedVisible, set: setGiftReceivedVisible },
        { el: fireworkBox, label: "Firework", get: () => fireworkEnabled, set: setFireworkEnabled },
        { el: customRewardBox, label: "Custom Reward", get: () => !!customRewardState.enabled, set: setCustomRewardEnabledState },
      ];
      const toggles = [];
      defs.forEach((d) => {
        if (!d.el) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "edit-layout-toggle";
        btn.style.display = "none";
        const sync = () => {
          const on = d.get();
          btn.textContent = d.label + ": " + (on ? "On" : "Off");
          btn.classList.toggle("is-off", !on);
        };
        btn.addEventListener("pointerdown", (e) => { e.stopPropagation(); });
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          d.set(!d.get());
          sync();
        });
        host.appendChild(btn);
        toggles.push({ d, btn, sync });
      });

      let rafId = null;
      function positionAll() {
        const hr = host.getBoundingClientRect();
        toggles.forEach(({ d, btn }) => {
          const r = d.el.getBoundingClientRect();
          const visible = r.width > 1 && r.height > 1 && getComputedStyle(d.el).display !== "none";
          if (!visible) { btn.style.display = "none"; return; }
          btn.style.display = "block";
          btn.style.left = (r.left - hr.left) + "px";
          btn.style.top = (r.top - hr.top) + "px";
        });
        rafId = editMoveEnabled ? requestAnimationFrame(positionAll) : null;
      }

      window.__editLayoutToggles = {
        show() { toggles.forEach((t) => t.sync()); if (!rafId) positionAll(); },
        hide() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } toggles.forEach((t) => { t.btn.style.display = "none"; }); },
        sync() { toggles.forEach((t) => t.sync()); },
      };
    })();

    initChannel();

    // ─── Decorate Overlay ──────────────────────────────────────────────
    /* Decorate overlay moved to js/decor.js (window.App.decor / window.decor*). */

    // Preload speech synthesis voices so they're ready for TTS commands
    if (window.speechSynthesis) window.speechSynthesis.getVoices();
    // preloadGiftAssets is called after requireLogin succeeds
    // After init, broadcast mode1's actual layout so mode2 sliders stay in sync
    setTimeout(() => broadcastCurrentStyle("host-init"), 500);
    try {
      const savedFacing = localStorage.getItem(camFacingStoreKey);
      if (savedFacing === "user" || savedFacing === "environment") currentFacingMode = savedFacing;
    } catch (err) { /* ignore */ }
    try {
      if (!camBgLoadedFromServer) {
        // Show this device's saved background quickly; the login path will
        // re-confirm once the session resolves. Default video if nothing saved.
        restoreCamBgFromLocal().then((restored) => {
          if (!restored && !camBgLoadedFromServer) applyDefaultCamBgVideo();
        });
      }
    } catch (err) { /* ignore */ }
    try {
      const savedWebBg = localStorage.getItem(webBgStoreKey);
      if (savedWebBg === null) {
        setWebBackground(defaultWebBgUrl, false);
      } else {
        setWebBackground(savedWebBg, false);
      }
    } catch (err) {
      setWebBackground(defaultWebBgUrl, false);
    }
    /* PRIVACY: if a cam background is configured on this device, force the cam
       OFF at startup so the host's face can never flash before the background
       loads. The background replaces the camera anyway. (CAM_BG_NONE means the
       host explicitly chose "live camera, no background" — that's allowed on.) */
    try {
      const _bgMarker = localStorage.getItem(camBgStoreKey) || "";
      if (_bgMarker && _bgMarker !== CAM_BG_NONE) camVisible = false;
    } catch (e) { /* ignore */ }
    /* Only power on the webcam at startup if the cam is actually on (or VRM
       needs the feed). With the cam defaulting to OFF, this keeps the MacBook
       camera light off until the host turns the camera on. */
    if (camVisible || camVrmEnabled) startCamera();
    applyCamVisibility();
    startMicMonitor();
    positionGiftOverlay();
    window.addEventListener("resize", positionGiftOverlay);
    window.addEventListener("resize", applyRoomStyle);
    if (preferredMode === "host") {
      // already in host mode
    }
  </script>
</body>
</html>
