<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTokkingDubai Access</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #161a21;
      --text: #e8ecf2;
      --muted: #8b93a6;
      --accent: #5dd1ff;
      --border: #232836;
      --danger: #ff5c5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "TikTok Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(93, 209, 255, 0.1), transparent 28%),
                  radial-gradient(circle at 80% 0%, rgba(155, 123, 255, 0.12), transparent 35%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .hidden { display: none !important; }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .login-card {
      width: min(460px, 100%);
      background: rgba(22, 26, 33, 0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.35);
      text-align: left;
    }
    .login-card h1 { margin: 0 0 8px; }
    .login-card p { margin: 0 0 16px; color: var(--muted); }
    .login-card label { display: block; font-weight: 700; margin: 12px 0 6px; }
    .login-card input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b0f16;
      color: var(--text);
    }
    .login-card button[type="submit"] {
      width: 100%;
      margin-top: 12px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(93,209,255,0.18), rgba(155,123,255,0.18));
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .login-card .contact-btn {
      width: 100%;
      margin-top: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .login-error { color: var(--danger); margin-top: 10px; }
    .login-attempts { margin-top: 8px; color: var(--muted); }
    .login-footnote { margin-top: 14px; font-size: 13px; color: var(--muted); }

    .app-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .app-card {
      width: min(520px, 100%);
      background: rgba(22, 26, 33, 0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.35);
      text-align: center;
    }
    .app-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
    .display-name-row {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .display-name-input {
      width: min(280px, 100%);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b0f16;
      color: var(--text);
    }
    .pill-button {
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(93,209,255,0.18), rgba(155,123,255,0.18));
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill-button.secondary { background: transparent; }

    .portal-live-panel {
      margin-top: 18px;
      text-align: left;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: grid;
      gap: 10px;
    }
    .portal-live-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .portal-live-title {
      margin: 0;
      font-size: 16px;
    }
    .portal-live-status {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
    }
    .portal-live-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .portal-live-field label {
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
    }
    .portal-live-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Lion upgrade download progress */
    .lion-dl-bar {
      margin-top: 18px;
      display: none;
    }
    .lion-dl-bar.active { display: block; }
    .lion-dl-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .lion-dl-track {
      width: 100%;
      height: 6px;
      background: #1c2029;
      border-radius: 999px;
      overflow: hidden;
    }
    .lion-dl-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #5dd1ff, #9b7bff);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .lion-dl-done {
      font-size: 12px;
      color: #5dd1ff;
      margin-top: 6px;
      display: none;
    }

    .admin-panel {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2000;
    }
    .admin-panel.active { display: flex; }
    .admin-card {
      width: min(960px, 100%);
      background: #121620;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      max-height: 90vh;
      overflow: auto;
    }
    .admin-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .admin-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; }
    .admin-heading-actions { display: flex; gap: 10px; }
    .admin-stats-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin: 18px 0; }
    .admin-stat-card { background: #0b0f16; border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .stat-label { color: var(--muted); font-size: 12px; margin: 0; }
    .stat-value { margin: 6px 0 0; font-size: 22px; font-weight: 700; }
    .admin-section { margin-top: 18px; }
    .admin-form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .admin-form-grid label { display: block; font-weight: 700; margin-bottom: 6px; }
    .admin-form-grid input, .admin-form-grid select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0f16;
      color: var(--text);
    }
    .users-list { display: grid; gap: 10px; }
    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #0b0f16;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .user-meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .user-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .user-actions button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .user-actions .delete-user { border-color: var(--danger); color: var(--danger); }
    .user-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .user-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .user-tag.active { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .user-tag.pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .user-tag.expiring { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .user-tag.addon-on { background: rgba(93, 209, 255, 0.2); color: #5dd1ff; }
    .user-tag.addon-off { background: rgba(139, 147, 166, 0.15); color: #8b93a6; }
    .empty-state-card { text-align: center; color: var(--muted); padding: 16px; }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>Secure Access</h1>
      <p>Enter your assigned credentials to unlock host/remote access.</p>
      <form id="loginForm">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" autocomplete="username" required />

        <label for="loginPassword">Password</label>
        <div style="position: relative; margin-bottom: 12px;">
          <input type="password" id="loginPassword" autocomplete="current-password" required style="padding-right: 45px;" />
          <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 4px; cursor: pointer; color: var(--muted); line-height: 0; display: flex; align-items: center;">
            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <button type="submit" id="loginButton">Log in</button>
        <button type="button" id="contactMeBtn" class="contact-btn">Contact Me</button>
      </form>
      <p id="loginError" class="login-error hidden"></p>
      <div id="loginAttempts" class="login-attempts hidden">Attempts used: <span id="attemptValue">0</span>/5</div>
    </div>
  </div>

  <div id="appShell" class="app-shell hidden">
    <div class="app-card">
      <h2>Welcome <span id="sessionUsername" class="hidden"></span></h2>
      <p id="timeLeftBadge" class="hidden"></p>
      <div class="app-actions">
        <button class="pill-button" id="openHost">Open Mode 1 (Host)</button>
        <button class="pill-button secondary" id="openRemote">Open Mode 2 (Remote)</button>
        <button class="pill-button secondary" id="openMakeVideo">Make Video</button>
        <button class="pill-button secondary" id="logoutBtn" type="button">Logout</button>
      </div>


    </div>
  </div>

  <div id="adminPanel" class="admin-panel" aria-hidden="true">
    <div class="admin-card">
      <div class="admin-heading">
        <div>
          <p class="admin-label">Control Center</p>
          <h2>Admin Panel</h2>
        </div>
        <div class="admin-heading-actions">
          <button class="pill-button secondary" type="button" id="refreshCustomersBtn">Refresh</button>
          <button class="pill-button secondary" type="button" id="closeAdminBtn">Close</button>
        </div>
      </div>

      <div class="admin-stats-grid">
        <div class="admin-stat-card">
          <p class="stat-label">Total users</p>
          <p class="stat-value" id="totalUsersStat">0</p>
        </div>
        <div class="admin-stat-card">
          <p class="stat-label">Active now</p>
          <p class="stat-value" id="activeUsersStat">0</p>
        </div>
        <div class="admin-stat-card">
          <p class="stat-label">Waiting</p>
          <p class="stat-value" id="waitingUsersStat">0</p>
        </div>
        <div class="admin-stat-card">
          <p class="stat-label">Expiring soon</p>
          <p class="stat-value" id="expiringUsersStat">0</p>
        </div>
      </div>

      <section class="admin-section">
        <div class="section-heading">
          <div>
            <p class="admin-label">New pass</p>
            <h3>Create customer</h3>
          </div>
        </div>
        <form id="createUserForm">
          <div class="admin-form-grid">
            <div>
              <label for="newUsername">Username</label>
              <input type="text" id="newUsername" placeholder="new username" required />
            </div>
            <div>
              <label for="newPassword">Password</label>
              <div style="position: relative;">
                <input type="password" id="newPassword" placeholder="temporary password" minlength="6" required style="padding-right: 45px;" />
                <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 4px; cursor: pointer; color: var(--muted); line-height: 0; display: flex; align-items: center;">
                  <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div>
              <label for="userDuration">Duration</label>
              <select id="userDuration">
                <option value="30">30 minutes (test)</option>
                <option value="60">1 hour</option>
                <option value="120">2 hours</option>
                <option value="1440">1 day</option>
                <option value="10080">1 week</option>
                <option value="43200">1 month (30 days)</option>
                <option value="129600">3 months</option>
                <option value="259200">6 months</option>
                <option value="525600">1 year</option>
                <option value="custom">Custom minutes</option>
              </select>
            </div>
            <div id="customDurationWrap" style="display: none;">
              <label for="userCustomDuration">Custom Minutes</label>
              <input type="number" id="userCustomDuration" min="1" max="525600" step="1" placeholder="Enter minutes" />
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
              <input type="checkbox" id="newUserAddon" />
              <label for="newUserAddon" style="margin: 0; cursor: pointer;">Enable Overlay Add-on</label>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
              <input type="checkbox" id="newUserMakeVideoOnly" />
              <label for="newUserMakeVideoOnly" style="margin: 0; cursor: pointer;">Make Video only (no Mode 1 / Mode 2)</label>
            </div>
          </div>
          <div style="margin-top: 12px;">
            <button class="pill-button" type="submit">Save customer</button>
          </div>
        </form>
      </section>

      <section class="admin-section">
        <div class="section-heading">
          <div>
            <p class="admin-label">Customers</p>
            <h3>Live sessions</h3>
          </div>
          <div class="section-actions">
            <button class="pill-button secondary" type="button" id="deleteExpiredBtn">Delete expired</button>
          </div>
        </div>
        <div class="admin-toolbar" style="margin: 12px 0;">
          <input type="text" id="adminSearchInput" placeholder="Search username" />
        </div>
        <div class="users-list-wrapper">
          <div id="usersList" class="users-list"></div>
          <div id="adminEmptyState" class="empty-state-card" style="display:none;" data-default-text="No customers yet. Create your first user above.">
            <p>No customers yet. Create your first user above.</p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const hostBtn = document.getElementById('openHost');
    const remoteBtn = document.getElementById('openRemote');
    const portalLiveStatus = document.getElementById('portalLiveBridgeStatus');
    const portalLiveNameInput = document.getElementById('liveStreamNameInput');
    const portalLiveSessionIdInput = document.getElementById('liveSessionIdInput');
    const portalStartLiveBtn = document.getElementById('portalStartLiveBridge');
    const portalStopLiveBtn = document.getElementById('portalStopLiveBridge');

    let portalLiveUsername = null;

    function normalizeTikTokName(value) {
      return String(value || '').trim().replace(/^@+/, '');
    }

    function getLiveStreamNameStorageKey(username) {
      return `tiktok-live-stream-name:${String(username || 'default').toLowerCase()}`;
    }

    function getLiveSessionIdStorageKey(username) {
      return `tiktok-live-session-id:${String(username || 'default').toLowerCase()}`;
    }

    function getStoredLiveStreamName(username) {
      try {
        return (localStorage.getItem(getLiveStreamNameStorageKey(username)) || '').trim();
      } catch (err) {
        return '';
      }
    }

    function saveStoredLiveStreamName(username, value) {
      try {
        localStorage.setItem(getLiveStreamNameStorageKey(username), normalizeTikTokName(value));
      } catch (err) {
        // ignore
      }
    }

    function getStoredLiveSessionId(username) {
      try {
        return (localStorage.getItem(getLiveSessionIdStorageKey(username)) || '').trim();
      } catch (err) {
        return '';
      }
    }

    function saveStoredLiveSessionId(username, value) {
      try {
        localStorage.setItem(getLiveSessionIdStorageKey(username), String(value || '').trim());
      } catch (err) {
        // ignore
      }
    }

    async function loadPortalLiveUserAndInputs() {
      try {
        const res = await fetch('/api/auth/status', { credentials: 'include' });
        const body = await res.json();
        if (!res.ok || !body?.authenticated) return null;
        const username = String(body.user?.username || '').trim().toLowerCase();
        portalLiveUsername = username || null;
        const storedName = getStoredLiveStreamName(portalLiveUsername);
        const storedSessionId = getStoredLiveSessionId(portalLiveUsername);
        if (portalLiveNameInput && storedName) portalLiveNameInput.value = storedName;
        if (portalLiveSessionIdInput && storedSessionId) portalLiveSessionIdInput.value = storedSessionId;
        return portalLiveUsername;
      } catch (err) {
        return null;
      }
    }

    async function refreshPortalLiveStatus() {
      try {
        // Only fetch user info if not already loaded — avoid hitting /api/auth/status on every poll
        if (!portalLiveUsername) await loadPortalLiveUserAndInputs();
        const res = await fetch('/api/tiktok-live/status', { credentials: 'include' });
        const body = await res.json();
        if (!res.ok) throw new Error(body?.error || 'status failed');
        const connectedLiveId = normalizeTikTokName(body?.liveUniqueId);
        if (portalLiveStatus) {
          portalLiveStatus.textContent = body.connected
            ? `Connected @${connectedLiveId || ''}`
            : (body.active ? 'Connecting...' : 'Disconnected');
        }
        if (body.connected && connectedLiveId) {
          if (portalLiveNameInput) portalLiveNameInput.value = connectedLiveId;
          saveStoredLiveStreamName(portalLiveUsername, connectedLiveId);
        }
      } catch (err) {
        if (portalLiveStatus) portalLiveStatus.textContent = 'Status unavailable';
      }
    }

    async function startPortalLiveBridge() {
      const username = portalLiveUsername || await loadPortalLiveUserAndInputs();
      const liveUniqueId = normalizeTikTokName(portalLiveNameInput?.value || getStoredLiveStreamName(username));
      const sessionId = String(portalLiveSessionIdInput?.value || getStoredLiveSessionId(username) || '').trim();
      if (!liveUniqueId) {
        if (portalLiveStatus) portalLiveStatus.textContent = 'Enter TikTok host name first';
        return;
      }

      saveStoredLiveStreamName(username, liveUniqueId);
      saveStoredLiveSessionId(username, sessionId);
      if (portalLiveNameInput) portalLiveNameInput.value = liveUniqueId;
      if (portalLiveSessionIdInput) portalLiveSessionIdInput.value = sessionId;
      if (portalLiveStatus) portalLiveStatus.textContent = 'Connecting...';

      try {
        const res = await fetch('/api/tiktok-live/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ liveUniqueId, sessionId }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body?.error || 'start failed');
        const connectedLiveId = normalizeTikTokName(body?.liveUniqueId || liveUniqueId);
        if (portalLiveNameInput) portalLiveNameInput.value = connectedLiveId;
        saveStoredLiveStreamName(username, connectedLiveId);
        if (portalLiveStatus) portalLiveStatus.textContent = `Connected @${connectedLiveId}`;
      } catch (err) {
        const rawMessage = String(err?.message || 'start failed');
        const hint = /initial room data/i.test(rawMessage)
          ? ' Add Session ID cookie value and confirm host is currently live.'
          : '';
        if (portalLiveStatus) portalLiveStatus.textContent = `Error: ${rawMessage}${hint}`;
      }
    }

    async function stopPortalLiveBridge() {
      if (portalLiveStatus) portalLiveStatus.textContent = 'Stopping...';
      try {
        const res = await fetch('/api/tiktok-live/stop', {
          method: 'POST',
          credentials: 'include',
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body?.error || 'stop failed');
        if (portalLiveStatus) portalLiveStatus.textContent = 'Disconnected';
      } catch (err) {
        if (portalLiveStatus) portalLiveStatus.textContent = `Error: ${err?.message || 'stop failed'}`;
      }
    }

    if (hostBtn) hostBtn.addEventListener('click', () => {
      window.open('mode1.html?mode=host', '_blank');
    });
    if (remoteBtn) remoteBtn.addEventListener('click', () => {
      window.open('mode2.html?mode=remote', '_blank');
    });
    const makeVideoBtn = document.getElementById('openMakeVideo');
    if (makeVideoBtn) makeVideoBtn.addEventListener('click', () => {
      window.open('makevideo.html', '_blank');
    });

    if (portalLiveStatus || portalLiveNameInput || portalLiveSessionIdInput || portalStartLiveBtn || portalStopLiveBtn) {
      if (portalStartLiveBtn) {
        portalStartLiveBtn.addEventListener('click', () => {
          startPortalLiveBridge();
        });
      }

      if (portalStopLiveBtn) {
        portalStopLiveBtn.addEventListener('click', () => {
          stopPortalLiveBridge();
        });
      }

      if (portalLiveNameInput) {
        portalLiveNameInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            startPortalLiveBridge();
          }
        });
      }

      if (portalLiveSessionIdInput) {
        portalLiveSessionIdInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            startPortalLiveBridge();
          }
        });
        portalLiveSessionIdInput.addEventListener('blur', () => {
          saveStoredLiveSessionId(portalLiveUsername, portalLiveSessionIdInput.value || '');
        });
      }

      refreshPortalLiveStatus();
      setInterval(refreshPortalLiveStatus, 15000);
    }

    /* ---- Lion upgrade: listen for download progress from mode1 ---- */
    const isIPhone = /iPhone|iPod/.test(navigator.userAgent);
    const lionDlCh = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('lion-upgrade-dl') : null;

    function showLionDlProgress(pct) {
      const bar   = document.getElementById('lionDlBar');
      const label = document.getElementById('lionDlLabel');
      const pctEl = document.getElementById('lionDlPct');
      const fill  = document.getElementById('lionDlFill');
      const done  = document.getElementById('lionDlDone');
      if (!bar) return;
      bar.classList.add('active');
      if (pct >= 100) {
        if (label) label.style.display = 'none';
        if (done) done.style.display = 'block';
        if (fill) fill.style.width = '100%';
      } else {
        if (label) label.style.display = '';
        if (done) done.style.display = 'none';
        if (pctEl) pctEl.textContent = pct;
        if (fill) fill.style.width = pct + '%';
      }
    }

    if (!isIPhone && lionDlCh) {
      lionDlCh.onmessage = (e) => {
        const msg = e.data;
        if (msg && msg.type === 'lion-dl') {
          if (msg.status === 'done') showLionDlProgress(100);
          else if (msg.status === 'progress') showLionDlProgress(msg.pct || 0);
          else if (msg.status === 'error') {
            const bar = document.getElementById('lionDlBar');
            if (bar) bar.classList.remove('active');
          }
        }
      };
      // Also check IndexedDB on load to show "ready" if already cached
      (async () => {
        try {
          const req = indexedDB.open('lionUpgradeCache', 1);
          req.onupgradeneeded = () => { req.result.createObjectStore('blobs'); };
          req.onsuccess = () => {
            const db = req.result;
            const tx = db.transaction('blobs', 'readonly');
            const r = tx.objectStore('blobs').get('lionupgrade_webm_v5');
            r.onsuccess = () => { if (r.result) showLionDlProgress(100); };
          };
        } catch(e) {}
      })();
    }

    // Inline SVG eye icons (no external font/CDN dependency, so they always
    // render — including offline in the Electron app).
    const EYE_OPEN_SVG = '<svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_SLASH_SVG = '<svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    document.querySelectorAll('.password-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (!input) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        // Match the icon size already in the button.
        const size = btn.querySelector('svg')?.getAttribute('width') || '20';
        btn.innerHTML = (isPassword ? EYE_SLASH_SVG : EYE_OPEN_SVG).replace(/width="20" height="20"/, `width="${size}" height="${size}"`);
        btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    });
  </script>
  <!-- Electron-safe modal dialogs (prompt/alert/confirm replacements) -->
  <style>
    #_eModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99999;align-items:center;justify-content:center}
    #_eModal.on{display:flex}
    #_eBox{background:#161a21;border:1px solid #232836;border-radius:14px;padding:24px 28px;width:360px;max-width:90vw;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
    #_eMsg{font-size:14px;color:#e8ecf2;line-height:1.5;white-space:pre-wrap}
    #_eInput{width:100%;padding:10px 12px;background:#0f1115;border:1px solid #232836;border-radius:8px;color:#e8ecf2;font-size:15px;font-family:inherit;outline:none}
    #_eInput:focus{border-color:#5dd1ff}
    #_eBtns{display:flex;gap:10px;justify-content:flex-end}
    #_eBtns button{padding:8px 20px;border-radius:10px;border:1px solid #232836;background:transparent;color:#e8ecf2;cursor:pointer;font-size:14px;font-family:inherit}
    #_eOk{background:#5dd1ff!important;color:#000!important;border-color:#5dd1ff!important;font-weight:700}
    #_eDanger{background:#e53e3e!important;color:#fff!important;border-color:#e53e3e!important;font-weight:700}
  </style>
  <div id="_eModal">
    <div id="_eBox">
      <div id="_eMsg"></div>
      <input id="_eInput" type="text" autocomplete="off" style="display:none" />
      <div id="_eBtns">
        <button id="_eCancel" style="display:none">Cancel</button>
        <button id="_eOk">OK</button>
      </div>
    </div>
  </div>
  <script src="temp-auth.js"></script>
</body>
</html>
